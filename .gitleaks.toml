# Root leak-scanner config (gitleaks 8.30.1), auto-discovered by `gitleaks git`/`gitleaks dir`
# and by CI.  Default rules stay on; the allowlists below are a REVIEWED set of paths whose only
# findings are (a) ordinary prose that the entropy rule mis-fires on, or (b) synthetic,
# credential-shaped fixtures that exercise the credential guard / redactor.  No entry below
# exempts a whole file blindly: prose files are limited to the one mis-firing rule, and every
# fixture entry names the exact fake value, so a NEW credential-shaped string in these files
# still fails the gate.  Never add a path here without reviewing its findings.
#
# Gate: gitleaks git --log-opts=--all --redact -c .gitleaks.toml   (must exit 0)
title = "plangraph public repo"

[extend]
useDefault = true

[[allowlists]]
# generic-api-key mis-fires on the prose "tokens, bool/str/negative" in the historical
# PROMPT.md (deleted from the tree, still in git history).  Not a credential of any kind.
description = "plan/prompt prose false positive in PROMPT.md"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^PROMPT\.md$''']
regexes = ['''^bool/str/negative$''']

[[allowlists]]
# generic-api-key mis-fires on the plan-id list "Q-API-PUSH, RT-P2-DECISIONS" in the historical
# orchestration-setup plan (deleted from the tree, still in git history).  Not a credential.
description = "plan prose false positive in docs/plans/2026-10-16-orchestration-setup.md"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^docs/plans/2026-10-16-orchestration-setup\.md$''']
regexes = ['''^RT\-P2\-DECISIONS$''']

[[allowlists]]
# Fake credential the keeper credential-guard tests assert are found and masked.
description = "synthetic secret in the credential-guard test"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_keeper_credential_guard\.py$''']
regexes = ['''^svcacct/Zq9xk2LmPw$''']

[[allowlists]]
# Reason: the estimate/src-edit guard test asserts that "login " plus exactly this synthetic
# pair is refused (and never echoed), so the value has to sit in the source as one plain
# literal the leak gate can read: no split fragments to reassemble around the scanner.  Fake,
# no credential of any kind.  Scope is this file AND this exact value only (condition = AND):
# any other credential-shaped string written into the same file is still reported.
description = "synthetic credential the estimate-src-edit guard refuses"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_keeper_estimate_src_edit\.py$''']
regexes = ['''^svcacct/Zq9xk2LmPw$''']

[[allowlists]]
# Reason: the key-guard refusal corpus (REAL) is the set of credential pairs the guard must
# refuse and the mask tests must mask, so the slash pair sits there as one plain literal the
# leak gate can read: no split fragments to reassemble around the scanner.  Fake, no
# credential of any kind.  Scope is this file AND this exact value only (condition = AND):
# any other credential-shaped string written into the same file is still reported.
description = "synthetic password the key-guard refusal corpus expects refused"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_keeper_guard_key\.py$''']
regexes = ['''^svc/Xk9fT2mQ$''']

[[allowlists]]
description = "synthetic demo value in tests/fixtures/md_sync/sample_questions.md"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/fixtures/md_sync/sample_questions\.md$''',
         '''^tests/fixtures/md_sync/QUESTIONS\.md$''']
regexes = ['''^Zx81kQ92LmPq77Vb$''']

[[allowlists]]
# Reason: the e2e scenario carries the synthetic demo value as a plain literal (the
# test asserts it is redacted out of stored descriptions and notes by name), so the
# value sits in this source as one string the leak gate can read: no split fragments
# to reassemble around the scanner.  Fake, no credential of any kind.  Entries are
# path-scoped, so this file needs its OWN path+value entry; scoped to this exact path
# AND this exact value (condition = AND), any other credential-shaped string in this
# file stays reported.
description = "synthetic demo value in tests/test_md_sync_e2e.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_md_sync_e2e\.py$''']
regexes = ['''^Zx81kQ92LmPq77Vb$''']

[[allowlists]]
description = "synthetic demo value in tests/test_md_sync_parse.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_md_sync_parse\.py$''']
regexes = ['''^Zx81kQ92LmPq77Vb$''']

[[allowlists]]
description = "synthetic demo value in tests/test_md_sync_parse.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_md_sync_parse\.py$''']
regexes = ['''^AbCd1234Efgh$''']

[[allowlists]]
description = "synthetic demo value in tests/test_md_sync_plan.py"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_md_sync_plan\.py$''']
regexes = ['''^Zx81kQ92LmPq77Vb$''']

[[allowlists]]
description = "test sentinel for OPENCODE_API_KEY in worker-core sandbox_env tests (fake)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^rust/worker-core/src/sandbox_env\.rs$''']
regexes = ['''^sentinel-wf8-opkey$''']

[[allowlists]]
# The recorded replay histories carry synthetic phase/card ids under a "key" field, which the
# generic-api-key entropy gate reads as a credential: "phase-<digits>" and "e2e-phase|defer-a|b-<digits>"
# are replay identifiers (unix-time + counter), not secrets of any kind.
# The 12 older id generations still sitting in the git history (RT-P1-PHASE-RUNNER S2,
# commits fe2645a3 + 64cdb5f3) join the 6 the current fixtures hold: 18 reviewed values, each
# under its OWN ^...$ regex, so a new id or any other credential-shaped value in either fixture
# is still reported.  The entry keeps the shared 2-path form rather than one path per value:
# this snapshot carries no git history, so which fixture file each historical id was recorded
# in cannot be proven here -- the shared entry is the same reviewed two-fixture path set and a
# superset of per-file scoping, so the history gate on the real clone cannot miss a value.
description = "synthetic phase/card ids in the Temporal replay fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^rust/worker/tests/fixtures/phase_defer\.json$''',
         '''^rust/worker/tests/fixtures/phase_two_cards\.json$''']
regexes = ['''^e2e-defer-a-33069540525861094644722115702876536833$''',
           '''^e2e-defer-b-33069540525861163949139600629661958146$''',
           '''^phase-33069540525861169132674685342045962243$''',
           '''^e2e-phase-a-33069540670160061784166484599698882561$''',
           '''^e2e-phase-b-33069540670160144222665750007685054466$''',
           '''^phase-33069540670160152892635464651174313987$''',
           '''^e2e-defer-a-33069397607394545167591213328121200644$''',
           '''^e2e-defer-a-33069465295839244738770422596414472193$''',
           '''^e2e-defer-b-33069397607394594328164169764076257285$''',
           '''^e2e-defer-b-33069465295839301296487752589899726850$''',
           '''^phase-33069397607394603385515509955466100742$''',
           '''^phase-33069465295839305354771448806001082371$''',
           '''^e2e-phase-a-33069397622649438415115238476464783369$''',
           '''^e2e-phase-a-33069465440153862981330642214886309889$''',
           '''^e2e-phase-b-33069397622649511593348978882256044042$''',
           '''^e2e-phase-b-33069465440153917306991939289515819010$''',
           '''^phase-33069397622649516942904760258026012683$''',
           '''^phase-33069465440153924519668872109950500867$''']

[[allowlists]]
# Reason: the worker-core check/redaction tests redact an obviously fake PEM block that sits in
# the source as ONE literal -- the TEST header, its letter-only filler (lines of exactly 64
# "A"s, no digits, no base64 body, no key material anywhere) and the matching footer.  The
# regex pins that whole block: header, that exact filler, footer.  Only such a fake block is
# waived, so a real key under this header (base64 body lines) matches nothing here and stays
# reported.  The "\s*" and "{64}" spellings keep this config's own text from ever matching the
# rule it exempts.
description = "fake PEM test block (header + 64-A filler + footer) in the worker-core check/redact tests"
condition = "AND"
targetRules = ["private-key"]
paths = ['''^rust/worker-core/src/check\.rs$''',
         '''^rust/worker-core/src/redact\.rs$''']
regexes = ['''^-----BEGIN TEST\s*PRIVATE KEY-----(?:\r?\nA{64})+\r?\n-----END TEST\s*PRIVATE KEY-----$''']

[[allowlists]]
# Reason: before the fixture became a single literal, the same two tests built the fake block
# programmatically, so in git history the private-key match starts at the header STRING LITERAL
# and runs on through the builder code (`.to_string()];`, the `for _ in 0..body_lines` loop,
# `"A".repeat(64)`) to the footer literal.  This entry waives exactly that historical shape --
# and NOTHING after its opening: the regex is pinned token by token from the header literal all
# the way to the footer literal and ends there (`$`, no open-ended `.*`), because gitleaks'
# private-key match spans header..first footer, so a prefix-only regex would waive a real
# base64 body dropped in anywhere before that footer.  A real key under this header is not
# waived here (test_real_key_inside_the_historical_shape_is_still_reported), nor by the entry
# above's absence.  Same two paths, same rule, AND condition.  The "\s*" spellings keep this
# config's own text from ever matching the rule it exempts.
description = "pre-fix programmatic fake-PEM builder in the worker-core check/redact tests, git history only"
condition = "AND"
targetRules = ["private-key"]
paths = ['''^rust/worker-core/src/check\.rs$''',
         '''^rust/worker-core/src/redact\.rs$''']
regexes = ['''^-----BEGIN TEST\s*PRIVATE KEY-----"\.to_string\(\)\];\s+for _ in 0\.\.body_lines\s*\{\s+v\.push\("A"\.repeat\(64\)\);\s+\}\s+v\.push\("-----END TEST\s*PRIVATE KEY-----$''']
