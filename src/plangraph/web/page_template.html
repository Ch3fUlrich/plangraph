<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Read-only plan graph: dependencies, ready and blocked work, critical path.">
<title>@@PAGE_TITLE@@</title>
<style>
@@PAGE_CSS@@
</style>
</head>
<body>
<header class="top">
  <div class="top-title">
    <h1>@@PAGE_TITLE@@</h1>
    <p class="sub" id="meta-line"></p>
  </div>
  <div class="progress" id="progress">
    <div class="bar" role="img" aria-label="percent done"><span id="progress-bar"></span></div>
    <p class="pct" id="progress-text"></p>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Views">
  <button id="tab-graph" type="button" role="tab" aria-selected="true" aria-controls="panel-graph">Graph</button>
  <button id="tab-list" type="button" role="tab" aria-selected="false" aria-controls="panel-list">List</button>
</nav>

<section class="controls" aria-label="Filters">
  <div class="control-group">
    <span class="control-label">Projects</span>
    <div id="project-chips" class="chips"></div>
  </div>
  <div class="control-group">
    <span class="control-label">Tracks</span>
    <div id="track-chips" class="chips"></div>
  </div>
  <div class="control-group">
    <label class="toggle"><input type="checkbox" id="collapse-done" checked> Collapse done per track</label>
  </div>
</section>

<main>
  <section id="panel-graph" class="tabpanel" role="tabpanel" aria-labelledby="tab-graph" hidden>
    <div class="graph-wrap">
      <div id="cy" aria-label="Dependency graph"></div>
      <p id="graph-empty" class="empty" hidden></p>
    </div>
    <div class="legend" id="legend" aria-label="Colour legend"></div>
  </section>

  <section id="panel-list" class="tabpanel" role="tabpanel" aria-labelledby="tab-list" hidden>
    <div id="list-content"></div>
  </section>
</main>

<aside id="details" class="details" aria-label="Item details" hidden></aside>

<script type="application/json" id="snapshot-data">@@SNAPSHOT_JSON@@</script>
@@VENDOR_SCRIPTS@@
<script>@@PAGE_JS@@</script>
</body>
</html>
