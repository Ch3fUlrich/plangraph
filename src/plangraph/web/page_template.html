<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Read-only plan graph: dependencies, ready and blocked work, critical path.">
<title>@@PAGE_TITLE@@</title>
<style>
@@PAGE_CSS@@
</style>
</head>
<body data-screen="graph" data-sbopen="1" data-textsize="M" data-theme="light">
<header class="top" role="banner">
  <button id="search-toggle" class="icon-btn phone-only" type="button" aria-label="Show search" aria-expanded="false">Search</button>
  <div class="top-title">
    <h1>@@PAGE_TITLE@@</h1>
    <p class="sub" id="meta-line"></p>
  </div>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search — press /" aria-label="Search items" autocomplete="off" spellcheck="false">
  </div>
  <nav class="tabs" role="tablist" aria-label="Pages">
    <button id="tab-graph" data-page="graph" type="button" role="tab" aria-selected="true" aria-controls="panel-graph">Graph</button>
    <button id="tab-list" data-page="table" type="button" role="tab" aria-selected="false" aria-controls="panel-list">Table</button>
    <button id="tab-qa" data-page="qa" type="button" role="tab" aria-selected="false" aria-controls="panel-qa"><span class="sb-label">Decisions &amp; Q&amp;A</span><span class="sb-count" id="sb-count-qa" hidden>0</span></button>
    <button id="tab-needs" data-page="needs" type="button" role="tab" aria-selected="false" aria-controls="panel-needs"><span class="sb-label">Needs You</span><span class="sb-count" id="sb-count-needs" hidden>0</span></button>
    <button id="tab-settings" data-page="settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" aria-label="Settings" title="Settings">&#9881;</button>
  </nav>
  <div class="progress" id="progress">
    <div class="bar" role="img" aria-label="percent done"><span id="progress-bar"></span></div>
    <p class="pct" id="progress-text"></p>
  </div>
</header>


<div class="layout">
  <aside id="sidebar" aria-label="Sidebar">
    <button id="sb-close" class="sb-close" type="button" aria-label="Back to graph">&#10005;</button>
    <div class="sb-body">
      <section id="sb-panel-projects" class="sb-panel" data-panel="projects" aria-label="Projects">
        <label class="toggle"><input type="checkbox" id="collapse-done" checked> Collapse done per track</label>
        <div id="project-tree" class="ptree" role="tree" aria-label="Projects, phases and tasks"></div>
      </section>
    </div>
  </aside>
  <div id="sb-resize" class="sb-resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>

  <main>
    <section id="panel-graph" class="tabpanel" role="tabpanel" aria-labelledby="tab-graph">
      <div class="graph-wrap">
        <div id="cy" aria-label="Dependency graph"></div>
        <p id="graph-empty" class="empty" hidden></p>
      </div>
      <div class="legend" id="legend" aria-label="Colour legend"></div>
    </section>

    <section id="panel-list" class="tabpanel" role="tabpanel" aria-labelledby="tab-list" hidden>
      <div id="list-content"></div>
    </section>

    <section id="panel-qa" class="tabpanel pg" role="tabpanel" aria-labelledby="tab-qa" hidden>
      <div id="sb-panel-qa" class="pg-body"></div>
      <div id="sb-panel-answers" class="pg-body"></div>
    </section>
    <section id="panel-needs" class="tabpanel pg" role="tabpanel" aria-labelledby="tab-needs" hidden>
      <div id="sb-panel-needs" class="pg-body"></div>
    </section>
    <section id="panel-settings" class="tabpanel pg" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div id="sb-panel-settings" class="pg-body"></div>
    </section>
  </main>

  <aside id="details" class="details bottom-sheet" data-snap="peek" aria-label="Item details" hidden></aside>
</div>

<div id="sb-scrim" hidden></div>

<nav id="tabbar" aria-label="Main sections">
  <button type="button" class="tab-btn" data-screen="graph" aria-current="page">Graph</button>
  <button type="button" class="tab-btn" data-screen="table">Table</button>
  <button type="button" class="tab-btn" data-screen="qa">Q&amp;A</button>
  <button type="button" class="tab-btn" data-screen="needs">Needs You<span class="tab-badge" id="inbox-badge" hidden>0</span></button>
  <button type="button" class="tab-btn" data-screen="menu">Filter</button>
  <button type="button" class="tab-btn" data-screen="settings" aria-label="Settings">&#9881;</button>
</nav>

<script type="application/json" id="snapshot-data">@@SNAPSHOT_JSON@@</script>
@@VENDOR_SCRIPTS@@
<script>@@PAGE_JS@@</script>
</body>
</html>
