[pytest]
addopts = -m "not integration"
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
markers =
    integration: requires a real executable and credential store; required with PLANGRAPH_REQUIRE_GO_INTEGRATION=1
    browser: headless Chromium browser test (tests/browser); deselected by the default suite, runs in the CI `browser` job
