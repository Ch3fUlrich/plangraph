name: Set up Temporal CLI
description: Cache the verified Temporal CLI 1.9.1 binary
runs:
  using: composite
  steps:
    - name: Restore Temporal CLI cache
      id: temporal-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/temporal-cli/1.9.1/temporal
        key: temporal-cli-${{ runner.os }}-${{ runner.arch }}-1.9.1
    - name: Download Temporal CLI 1.9.1
      if: steps.temporal-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        curl -fsSL -o "$dir/temporal.tar.gz" --retry 3 --retry-delay 5 \
          --retry-max-time 40 --retry-all-errors --connect-timeout 10 --max-time 20 \
          https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz || \
          curl -fsSL -o "$dir/temporal.tar.gz" --retry 24 --retry-delay 15 \
            --retry-max-time 360 --retry-all-errors --connect-timeout 30 --max-time 120 \
            'https://temporal.download/cli/archive/v1.9.1?platform=linux&arch=amd64'
        # Both official sources must match this pinned release archive SHA-256.
        echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $dir/temporal.tar.gz" | sha256sum -c -
        tar -xzf "$dir/temporal.tar.gz" -C "$dir" temporal
        mkdir -p "$HOME/.cache/temporal-cli/1.9.1"
        install -m 0755 "$dir/temporal" "$HOME/.cache/temporal-cli/1.9.1/temporal"
    - name: Export Temporal CLI path
      shell: bash
      run: echo "TEMPORAL_CLI=$HOME/.cache/temporal-cli/1.9.1/temporal" >> "$GITHUB_ENV"
