name: Same-SHA retry of failed Rust tests for classification
description: >-
  After a red cargo test step, run the failed tests once more on the same SHA and classify the two logs (ci-flake classify).
  Like the pytest retry this only describes the failure: the retry's own exit status is captured, never makes the job green and never
  stops the classification.
inputs:
  suite:
    description: Name for the record (cargo, worker, windows-spawnd, ...)
    required: true
  first-log:
    description: Log of the failed cargo test step
    required: true
  command:
    description: The cargo command to rerun without the test filter, e.g. `cargo test --no-fail-fast -p pg-spawnd`
    required: true
  flake-bin:
    description: Path of the ci-flake binary
    required: true
  working-directory:
    description: Directory the command runs in
    required: false
    default: rust
outputs:
  dir:
    description: Directory with first.log, second.log, flake-record.json and flake-items.json
    value: ${{ steps.retry.outputs.dir }}
runs:
  using: composite
  steps:
    - id: retry
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SUITE: ${{ inputs.suite }}
        FIRST_LOG: ${{ inputs.first-log }}
        RETRY_COMMAND: ${{ inputs.command }}
        FLAKE_BIN: ${{ inputs.flake-bin }}
        WORKDIR: ${{ inputs.working-directory }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUNNER_ID: ${{ runner.name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -uo pipefail
        # The step runs under bash -e: a failing retry must reach the classification, so its status is captured.
        set +e
        out="$RUNNER_TEMP/flake-$SUITE"
        mkdir -p "$out"
        cp "$FIRST_LOG" "$out/first.log"
        : > "$out/second.log"
        mapfile -t ids < <("$FLAKE_BIN" failed-ids "$out/first.log")
        retry_status=0
        if [ "${#ids[@]}" -gt 0 ] && [ "${#ids[@]}" -le 50 ]; then
          # shellcheck disable=SC2086
          (cd "$WORKDIR" && timeout -k 5s 900 $RETRY_COMMAND -- --exact "${ids[@]}") > "$out/second.log" 2>&1
          retry_status=$?
        fi
        echo "retry exit status: $retry_status" >> "$out/second.log"
        "$FLAKE_BIN" classify --suite "$SUITE" --runner "$RUNNER_ID" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" \
          --sha "$HEAD_SHA" --first "$out/first.log" --second "$out/second.log" --out "$out" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "dir=$out" >> "$GITHUB_OUTPUT"
