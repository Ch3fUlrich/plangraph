name: Set up pinned Rust
description: Install the same Rust release as local builds from the repository root and rust/
inputs:
  components:
    description: Additional rustup components
    required: false
  targets:
    description: Additional rustup targets
    required: false
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        toolchain=$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)
        test -n "$toolchain"
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Configure host compiler cache
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if command -v python3 >/dev/null 2>&1; then
          PYTHONPATH="$PWD/src" python3 -m plangraph.spawner.host_ready --cargo-cache-env "$GITHUB_ENV"
        elif command -v python >/dev/null 2>&1; then
          PYTHONPATH="$PWD/src" python -m plangraph.spawner.host_ready --cargo-cache-env "$GITHUB_ENV"
        else
          echo "::warning::Python unavailable; Cargo will build without a compiler cache"
          printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
        fi
