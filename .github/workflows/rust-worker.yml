name: rust-worker

# Exercises the Temporal worker against a real dev server (the spike only replayed histories).
# protoc is required because the Temporal protos build script needs it.

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/worker/**"
      - "rust/worker-core/**"
      - ".github/workflows/rust-worker.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!CHANGELOG*"
  workflow_dispatch:

# D-1338: lane branches run CI via their PR only; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "8"   # cap per-job cargo parallelism: 4 concurrent jobs share one box (D-1393)

jobs:
  worker:
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust/worker
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc and build tools (protoc is needed by the Temporal protos build script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/worker/target
          key: rust-worker-${{ runner.os }}-${{ hashFiles('rust/worker/Cargo.lock', 'rust/worker-core/Cargo.toml') }}
      - name: Install Temporal CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/temporal_cli.tar.gz" \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $RUNNER_TEMP/temporal_cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/temporal"
          tar -xzf "$RUNNER_TEMP/temporal_cli.tar.gz" -C "$RUNNER_TEMP/temporal"
          echo "$RUNNER_TEMP/temporal" >> "$GITHUB_PATH"
      - name: Start dev server
        run: |
          nohup temporal server start-dev --ip 127.0.0.1 --port 17233 --headless --db-filename "$RUNNER_TEMP/temporal.db" > "$RUNNER_TEMP/temporal.log" 2>&1 &
          for _ in $(seq 1 30); do
            if temporal operator cluster health --address 127.0.0.1:17233; then
              exit 0
            fi
            sleep 2
          done
          echo "dev server did not become healthy within 60s"
          tail -n 40 "$RUNNER_TEMP/temporal.log"
          exit 1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests against dev server
        run: cargo test
        env:
          PG_TEMPORAL_ADDR: http://127.0.0.1:17233
      - name: Dev server log
        if: always()
        run: tail -n 40 "$RUNNER_TEMP/temporal.log"
