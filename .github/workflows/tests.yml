# Only ci-gate required; full tier requires every job. Draft/sub-PRs select affected suites.

name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

# The full suite runs once, on the merge candidate: a train head (land/train-*), a batch/* head without the
# land-part label, a merge queue event, or a head a router GO row labels ci-full (a push to main and a dispatch
# also run it). Every other pull request, a part included (label land-part), runs the affected selection
# (tools/ci_select.py full_run_required).
# Marking a draft ready starts no run: the head already has its required ci-gate from the run its last push
# started, and a second run would leave the required check pending for an hour (landing a draft part).
# A newer push to the PR cancels the stale run, but never a workflow_dispatch run (timing measurements
# must finish) and never a run a label started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

permissions:
  contents: read

jobs:
  select:
    name: 'Select suites for this change'
    runs-on: ubuntu-24.04
    outputs:
      pytest: ${{ steps.sel.outputs.pytest }}
      pytest-postgres: ${{ steps.sel.outputs.pytest-postgres }}
      rust: ${{ steps.sel.outputs.rust }}
      rust-worker: ${{ steps.sel.outputs.rust-worker }}
      rust-spike: ${{ steps.sel.outputs.rust-spike }}
      browser: ${{ steps.sel.outputs.browser }}
      full: ${{ steps.sel.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: sel
        name: Select test suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 tools/ci_select.py select --event "${{ github.event_name }}" \
            --base-ref "$PR_BASE_REF" --head-ref "$PR_HEAD_REF" --labels "$PR_LABELS" \
            --base "$BASE_SHA" --head "$HEAD_SHA"

  # D-1751: public-pattern scrub over the whole tree. No --words and no private rules:
  # the private word list never enters CI; output is path:line:rule only. Runs on every change.
  scrub:
    name: 'Public scrub: no private names or secrets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: scrub_check (public patterns)
        run: python tools/split/scrub_check.py . --rules tools/split/manifest.toml --rules tools/split/scrub_ci.toml

  # AO-400LOC (D-3198): a file over 400 lines needs a .filesize-baseline entry
  # that only shrinks vs the base: PR origin/main, push the pushed-over sha, else HEAD~1.
  file-size:
    name: 'File size limit (400 lines)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env:
          FILESIZE_REQUIRE_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}
        run: python3 tools/check_file_size.py

  # D-4691: added production source must be Rust unless explicitly allowlisted.
  new-code-lang:
    name: 'New code is Rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup-rust
      - env:
          NEWCODE_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}
        run: python3 tools/check_new_code_lang.py

  # D-653: every change -> CHANGELOG.md + docs (.docs-map)
  changelog-docs:
    name: 'Changelog fragment and docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env:
          CHANGELOG_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}
        run: python3 tools/check_changelog_docs.py

  pytest:
    name: "Python tests, SQLite keeper (shard ${{ fromJSON('[1,2,3,4]')[matrix.shard] }} of ${{ vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 4 || 3 }})"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '[0,1,2,3]' || '[0,1,2]') }}
    env:
      PYTEST_SHARD: ${{ matrix.shard }}/${{ vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 4 || 3 }}
    needs: select
    if: needs.select.outputs.pytest == 'true'
    runs-on: ${{ vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 3
      - uses: actions/cache@v4
        timeout-minutes: 3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
      - name: Build fleet projection helper
        timeout-minutes: 8
        uses: ./.github/actions/bounded-step
        with:
          seconds: 465
          command: cargo build -j 2 --release -p pg-spawnd --manifest-path rust/Cargo.toml
      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # D-1393: pip wheel cache keyed on the requirements hash.
      - name: Restore pip cache
        timeout-minutes: 3
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('requirements-ci.txt') }}
      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with: {node-version: "22"}
      - name: Install test deps
        timeout-minutes: 5
        uses: ./.github/actions/bounded-step
        with:
          seconds: 285
          command: python -m pip install --quiet -r requirements-ci.txt
      - uses: ./.github/actions/setup-temporal
        timeout-minutes: 3
      - name: Git identity for tests that commit
        timeout-minutes: 3
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Restore verified gitleaks binary
        timeout-minutes: 3
        id: gitleaks-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-8.30.1
      # D-2557: release checksums or Go sumdb; no hard-coded digest or curl | sh.
      - name: Install gitleaks 8.30.1
        timeout-minutes: 8
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/bounded-step
        with:
          seconds: 465
          command: |
            set -euo pipefail
            dir=$(mktemp -d)
            trap 'rm -rf "$dir"' EXIT
            if curl -fsSL -o "$dir/gitleaks_8.30.1_linux_x64.tar.gz" --retry 3 --retry-delay 5 \
                --retry-max-time 40 --retry-all-errors --connect-timeout 10 --max-time 20 \
                https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz && \
              curl -fsSL -o "$dir/gitleaks_8.30.1_checksums.txt" --retry 3 --retry-delay 5 \
                --retry-max-time 40 --retry-all-errors --connect-timeout 10 --max-time 20 \
                https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt; then
              # Missing checksum lines and mismatches fail closed, not into fallback.
              grep -E "^[0-9a-f]{64}  gitleaks_8\.30\.1_linux_x64\.tar\.gz$" "$dir/gitleaks_8.30.1_checksums.txt" > "$dir/checks.sha256"
              (cd "$dir" && sha256sum -c checks.sha256)
              tar -xzf "$dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$dir" gitleaks
              "$dir/gitleaks" version | grep -Fx 8.30.1
            else
              # Force proxy + public checksum database even if runner defaults differ.
              GOBIN="$dir" GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
                GOPRIVATE= GONOSUMDB= GONOPROXY= \
                go install github.com/zricethezav/gitleaks/v8@v8.30.1
              go version -m "$dir/gitleaks" | grep -F 'github.com/zricethezav/gitleaks/v8'
            fi
            mkdir -p ~/.local/bin
            install -m 0755 "$dir/gitleaks" ~/.local/bin/gitleaks
      - name: Workflow archive policy
        timeout-minutes: 3
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: b=$(git rev-parse --verify --end-of-options "HEAD^1^{commit}") && git show "$b":tests/test_workflow_archive.py > .git/workflow_archive_base.py && python .git/workflow_archive_base.py "$b"
      - name: Check nonempty selection
        if: matrix.shard == 0
        timeout-minutes: 3
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        uses: ./.github/actions/bounded-step
        with:
          seconds: 165
          command: |
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.select.outputs.full }}" != "true" ]; then
              python tools/affected_tests.py --base "$BASE_SHA" > "$RUNNER_TEMP/plan.json"
            else
              echo '{"tests": ["tests"]}' > "$RUNNER_TEMP/plan.json"
            fi
            python -c 'import json, sys; plan = json.load(open(sys.argv[1])); print(json.dumps(plan), flush=True); sys.exit(0 if plan["tests"] else (print("Empty test selection", file=sys.stderr) or 5))' "$RUNNER_TEMP/plan.json"
      - name: pytest
        timeout-minutes: 15
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        uses: ./.github/actions/bounded-step
        with:
          seconds: 885
          command: |
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.select.outputs.full }}" != "true" ]; then
              python tools/affected_tests.py --base "$BASE_SHA" --run -n auto --maxfail 10
            else
              python -m pytest -q -n auto --dist loadgroup --durations=30 tests
            fi

    # UI-BROWSER-TESTS W1: headless Chromium only; CDN scripts are served from
    # committed local assets, so the job never needs network access to a CDN.
  browser:
    name: 'UI tests in headless Chromium'
    needs: select
    if: needs.select.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install test deps
        timeout-minutes: 5
        uses: ./.github/actions/bounded-step
        with:
          seconds: 285
          command: python -m pip install --quiet -r requirements-ci.txt
      - name: Restore Playwright browser cache
        timeout-minutes: 3
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}
      - name: Install Chromium
        timeout-minutes: 5
        uses: ./.github/actions/bounded-step
        with:
          seconds: 285
          command: python -m playwright install --with-deps chromium
      - name: browser tests
        timeout-minutes: 10
        uses: ./.github/actions/bounded-step
        with:
          seconds: 585
          command: python -m pytest -q tests/browser -m browser
      - name: Upload screenshots
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: out/ui-shots/*.png
          if-no-files-found: warn

  pytest-postgres:
    name: "Python tests, Postgres keeper: contract and storage (shard ${{ fromJSON('[1,2,3]')[matrix.shard] }} of 3)"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    needs: select
    if: needs.select.outputs.pytest-postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keeper
        ports:
          - 5432
        # Per-test schemas grow PG16 shared statistics beyond Docker's 64 MiB default.
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTEST_SHARD: ${{ matrix.shard }}/3
      PG_KEEPER_BACKEND: postgres
      # root-cause hunt (CI-PG-CONTRACT-TIMEOUT): on a hung request dump the keeper's thread stacks
      PG_CONTRACT_ABORT_ON_TIMEOUT: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with: {fetch-depth: 0}
      - name: Isolate contract latency output
        timeout-minutes: 3
        run: echo "PG_CONTRACT_LATENCY_DIR=$(mktemp -d "$RUNNER_TEMP/pg-contract-latency.XXXXXX")" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 3
      - uses: actions/cache@v4
        timeout-minutes: 3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
      - name: Build fleet projection helper
        timeout-minutes: 8
        uses: ./.github/actions/bounded-step
        with:
          seconds: 465
          command: cargo build -j 2 --release -p pg-spawnd --manifest-path rust/Cargo.toml
      - name: Set up Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # D-1393: pip wheel cache keyed on the requirements hash.
      - name: Restore pip cache
        timeout-minutes: 3
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('requirements-ci.txt') }}
      - name: Resolve Postgres service host
        timeout-minutes: 3
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        # On GitHub-hosted runners the service container is published on localhost.
        run: echo "PG_DSN=postgresql://postgres@localhost:$PG_PORT/keeper" >> "$GITHUB_ENV"
      - name: Install test deps
        timeout-minutes: 5
        uses: ./.github/actions/bounded-step
        with:
          seconds: 285
          command: python -m pip install --quiet -r requirements-ci.txt "psycopg[binary]"
      - uses: ./.github/actions/setup-temporal
        timeout-minutes: 3
      - name: Git identity for tests that commit
        timeout-minutes: 3
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Check nonempty collection
        timeout-minutes: 10
        if: matrix.shard == 0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        uses: ./.github/actions/bounded-step
        with:
          seconds: 585
          command: |
            FILES=$(grep -lE "keeper_util|door_util|plangraph\.keeper|from plangraph import" tests/test_*.py \
                    | xargs grep -L sqlite3 | tr '\n' ' ')
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.select.outputs.full }}" != "true" ]; then
              PYTEST_SHARD= python tools/affected_tests.py --base "$BASE_SHA" --within tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py tests/test_projector_ddl.py tests/test_worker_claim.py tests/test_claim_parity_dispatch.py $FILES --run --collect-only
            else
              PYTEST_SHARD= python -m pytest -q --collect-only tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py tests/test_projector_ddl.py tests/test_worker_claim.py tests/test_claim_parity_dispatch.py $FILES
            fi
      - name: pytest (contract suite + keeper storage tests on Postgres)
        timeout-minutes: 30
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        uses: ./.github/actions/bounded-step
        with:
          seconds: 1785
          command: |
            # keeper modules that never open the SQLite file directly
            FILES=$(grep -lE "keeper_util|door_util|plangraph\.keeper|from plangraph import" tests/test_*.py \
                    | xargs grep -L sqlite3 | tr '\n' ' ')
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.select.outputs.full }}" != "true" ]; then
              python tools/affected_tests.py --base "$BASE_SHA" --within tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py tests/test_projector_ddl.py tests/test_worker_claim.py tests/test_claim_parity_dispatch.py $FILES --run -n auto --maxfail 10
              exit $?
            fi
            # test_projector_ddl.py names sqlite3 (its SQLite cases) but also carries the Postgres cases
            python -m pytest -q -n auto --dist loadgroup --durations=30 tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py \
              tests/test_projector_ddl.py tests/test_worker_claim.py tests/test_claim_parity_dispatch.py $FILES

  rust:
    name: 'Rust workspace on Linux: fmt, clippy, tests'
    needs: select
    if: needs.select.outputs.rust == 'true'
    runs-on: ${{ vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: rust
    env:
      CI_SELF_HOSTED_RUN: ${{ (vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '1' || '0' }}
      CI_CARGO_TARGET_CAP_GB: ${{ vars.CI_CARGO_TARGET_CAP_GB || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - name: Hosted cargo build settings
        if: env.CI_SELF_HOSTED_RUN != '1'
        run: |
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"
      - name: Self-hosted cargo build settings
        if: env.CI_SELF_HOSTED_RUN == '1'
        working-directory: ${{ github.workspace }}
        env:
          CI_CARGO_PERSIST: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && '1' || '0' }}
        run: |
          set -euo pipefail
          # Only pushes to the default branch share a persistent target dir ($HOME/cargo-target/<repository>/<job>/<key>, key = hash of Cargo.lock and manifests); every other run builds into an empty per-run dir under RUNNER_TEMP, so a pull request never plants artifacts that later runs execute.
          cap="${CI_CARGO_TARGET_CAP_GB:-40}"
          case "$cap" in ''|*[!0-9]*) cap=40 ;; esac
          if [ "$CI_CARGO_PERSIST" = "1" ]; then
            root="$HOME/cargo-target/$GITHUB_REPOSITORY/rust"
            key=$(for f in rust/Cargo.toml rust/Cargo.lock rust/*/Cargo.toml; do if [ -f "$f" ]; then cat "$f"; fi; done | sha256sum | cut -c1-16)
            mkdir -p "$root"
            find "$root" -mindepth 1 -maxdepth 1 ! -name "$key" -exec rm -rf {} +
            if [ "$(du -sk "$root" | cut -f1)" -gt $((cap * 1024 * 1024)) ]; then rm -rf "$root"; mkdir -p "$root"; fi
            target="$root/$key"
          else
            target=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/cargo-target.XXXXXX")
          fi
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          # Test threads stay capped: one thread per CPU on a large runner makes the pg-spawnd launch tests flake.
          echo "RUST_TEST_THREADS=8" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.CI_SELF_HOSTED_RUN != '1'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # The dev profile lives in rust/Cargo.toml: a profile change must not reuse a target directory built with the old one.
          key: rust-dev-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check (windows-gnu)
        run: cargo check --target x86_64-pc-windows-gnu -p pg-worker-core -p pg-spawnd --all-targets
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pytest for the test deadline fixture
        timeout-minutes: 5
        uses: ./.github/actions/bounded-step
        with:
          seconds: 285
          command: python -m pip install "pytest<9.2"
      - name: Install debugger for hung Rust tests
        run: command -v gdb || sudo apt-get -o DPkg::Lock::Timeout=600 install -y gdb
      - name: Build pg-jail helper
        run: cargo build -p pg-jail
      - name: cargo test
        run: |
          PG_JAIL_BIN="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/rust/target}/debug/pg-jail" python ../tools/preflight.py --cargo-test
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - name: Native writer lifecycle (Python 3.14)
        run: python ../tools/preflight.py --cargo-test -p pg-spawnd --test native_writer

  rust-windows:
    name: 'Rust spawner and worker core tests on Windows'
    needs: select
    if: needs.select.outputs.rust == 'true'
    runs-on: ${{ vars.CI_SELF_HOSTED_WIN == '1' && vars.CI_WIN_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_WIN_RUNNER_LABELS) || 'windows-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # The dev profile lives in rust/Cargo.toml: a profile change must not reuse a target directory built with the old one.
          key: rust-dev-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
      - name: cargo test -p pg-spawnd
        run: python ../tools/preflight.py --cargo-test -p pg-spawnd
      - name: cargo test -p pg-worker-core
        run: python ../tools/preflight.py --cargo-test -p pg-worker-core

  rust-worker:
    name: 'Rust worker crate: fmt, clippy, tests'
    needs: select
    if: needs.select.outputs.rust-worker == 'true'
    runs-on: ${{ vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      CI_SELF_HOSTED_RUN: ${{ (vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '1' || '0' }}
      CI_CARGO_TARGET_CAP_GB: ${{ vars.CI_CARGO_TARGET_CAP_GB || '40' }}
    defaults:
      run:
        working-directory: rust/worker
    steps:
      - uses: actions/checkout@v4
      - name: Install debugger for hung Rust tests
        run: command -v gdb || sudo apt-get -o DPkg::Lock::Timeout=600 install -y gdb
      - name: Install protobuf compiler
        run: (command -v protoc >/dev/null && test -f /usr/include/google/protobuf/field_mask.proto) || (sudo apt-get -o DPkg::Lock::Timeout=600 update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y protobuf-compiler libprotobuf-dev)
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Hosted cargo build settings
        if: env.CI_SELF_HOSTED_RUN != '1'
        run: |
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/rust/worker/target" >> "$GITHUB_ENV"
      - name: Self-hosted cargo build settings
        if: env.CI_SELF_HOSTED_RUN == '1'
        working-directory: ${{ github.workspace }}
        env:
          CI_CARGO_PERSIST: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && '1' || '0' }}
        run: |
          set -euo pipefail
          # Only pushes to the default branch share a persistent target dir ($HOME/cargo-target/<repository>/<job>/<key>, key = hash of Cargo.lock and manifests); every other run builds into an empty per-run dir under RUNNER_TEMP, so a pull request never plants artifacts that later runs execute.
          cap="${CI_CARGO_TARGET_CAP_GB:-40}"
          case "$cap" in ''|*[!0-9]*) cap=40 ;; esac
          if [ "$CI_CARGO_PERSIST" = "1" ]; then
            root="$HOME/cargo-target/$GITHUB_REPOSITORY/rust-worker"
            key=$(for f in rust/worker/Cargo.toml rust/worker/Cargo.lock rust/worker-core/Cargo.toml rust/pg-spawnd/Cargo.toml rust/Cargo.toml rust/Cargo.lock; do if [ -f "$f" ]; then cat "$f"; fi; done | sha256sum | cut -c1-16)
            mkdir -p "$root"
            find "$root" -mindepth 1 -maxdepth 1 ! -name "$key" -exec rm -rf {} +
            if [ "$(du -sk "$root" | cut -f1)" -gt $((cap * 1024 * 1024)) ]; then rm -rf "$root"; mkdir -p "$root"; fi
            target="$root/$key"
          else
            target=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/cargo-target.XXXXXX")
          fi
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          # Test threads stay capped: one thread per CPU on a large runner makes the pg-spawnd launch tests flake.
          echo "RUST_TEST_THREADS=8" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.CI_SELF_HOSTED_RUN != '1'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/worker/target
          key: rust-worker-dev-${{ runner.os }}-${{ hashFiles('rust/worker/Cargo.lock', 'rust/worker/Cargo.toml', 'rust/worker-core/Cargo.toml', 'rust/pg-spawnd/Cargo.toml', 'rust/Cargo.lock', 'rust/Cargo.toml') }}
      - uses: ./.github/actions/setup-temporal
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        env:
          # Unit tests run attempts without the jail helper; the jail is covered by the rust job.
          PG_JAIL: "off"
          PG_TEST_ALLOW_UNJAILED: "1"
        run: |
          # Inside the cached target dir: the guard's nested cargo checks stay warm between runs.
          export PG_ADMISSION_GUARD_TARGET_DIR="$CARGO_TARGET_DIR/admission-guard"
          cargo run --manifest-path ../Cargo.toml -p pg-spawnd --bin ci-temporal -- python ../../tools/preflight.py --cargo-test

  rust-spike:
    name: 'Rust replay spike tests'
    needs: select
    if: needs.select.outputs.rust-spike == 'true'
    runs-on: ${{ vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_LINUX_RUNNER_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      CI_SELF_HOSTED_RUN: ${{ (vars.CI_SELF_HOSTED == '1' && vars.CI_LINUX_RUNNER_LABELS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '1' || '0' }}
      CI_CARGO_TARGET_CAP_GB: ${{ vars.CI_CARGO_TARGET_CAP_GB || '40' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install debugger for hung Rust tests
        run: command -v gdb || sudo apt-get -o DPkg::Lock::Timeout=600 install -y gdb
      - name: Install protobuf compiler
        run: (command -v protoc >/dev/null && test -f /usr/include/google/protobuf/field_mask.proto) || (sudo apt-get -o DPkg::Lock::Timeout=600 update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y protobuf-compiler libprotobuf-dev)
      - uses: ./.github/actions/setup-rust
      - name: Hosted cargo build settings
        if: env.CI_SELF_HOSTED_RUN != '1'
        run: |
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"
      - name: Self-hosted cargo build settings
        if: env.CI_SELF_HOSTED_RUN == '1'
        working-directory: ${{ github.workspace }}
        env:
          CI_CARGO_PERSIST: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && '1' || '0' }}
        run: |
          set -euo pipefail
          # Only pushes to the default branch share a persistent target dir ($HOME/cargo-target/<repository>/<job>/<key>, key = hash of Cargo.lock and manifests); every other run builds into an empty per-run dir under RUNNER_TEMP, so a pull request never plants artifacts that later runs execute.
          cap="${CI_CARGO_TARGET_CAP_GB:-40}"
          case "$cap" in ''|*[!0-9]*) cap=40 ;; esac
          if [ "$CI_CARGO_PERSIST" = "1" ]; then
            root="$HOME/cargo-target/$GITHUB_REPOSITORY/rust-spike"
            key=$(for f in rust/spikes/temporal-spike/Cargo.toml rust/spikes/temporal-spike/Cargo.lock; do if [ -f "$f" ]; then cat "$f"; fi; done | sha256sum | cut -c1-16)
            mkdir -p "$root"
            find "$root" -mindepth 1 -maxdepth 1 ! -name "$key" -exec rm -rf {} +
            if [ "$(du -sk "$root" | cut -f1)" -gt $((cap * 1024 * 1024)) ]; then rm -rf "$root"; mkdir -p "$root"; fi
            target="$root/$key"
          else
            target=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/cargo-target.XXXXXX")
          fi
          echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          # Test threads stay capped: one thread per CPU on a large runner makes the pg-spawnd launch tests flake.
          echo "RUST_TEST_THREADS=8" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.CI_SELF_HOSTED_RUN != '1'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/spikes/temporal-spike/target
          key: temporal-spike-${{ hashFiles('rust/spikes/temporal-spike/Cargo.lock') }}
      - name: cargo test replay
        run: python tools/preflight.py --cargo-test --manifest-path rust/spikes/temporal-spike/Cargo.toml --test replay

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    needs: [select, scrub, file-size, new-code-lang, changelog-docs, pytest, pytest-postgres, rust, rust-worker, rust-spike, rust-windows, browser]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 tools/ci_select.py gate --needs "$NEEDS_JSON" --event "$EVENT" \
            --base-ref "$PR_BASE_REF" --head-ref "$PR_HEAD_REF" --labels "$PR_LABELS"
      # Use BASE: a PR cannot weaken the gate that judges it; L1 needs green ci-gate at merge.
      - name: Commit trailers
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "new ref: nothing to check"
            exit 0
          fi
          git show "$BASE:tools/ci_commit_gate.py" > "$RUNNER_TEMP/ci_commit_gate_base.py"
          python3 "$RUNNER_TEMP/ci_commit_gate_base.py" check --base "$BASE" --head "$HEAD" --exempt tools/ci_commit_exempt.txt
