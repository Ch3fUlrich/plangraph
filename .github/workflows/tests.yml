# Only ci-gate required; selected must pass; unselected suites skip. Main/nightly/manual run all.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

# CI runs only on PRs into main (operator order); a newer push to the PR cancels the stale run,
# but never a workflow_dispatch run (timing measurements must finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      pytest: ${{ steps.sel.outputs.pytest }}
      pytest-postgres: ${{ steps.sel.outputs.pytest-postgres }}
      rust: ${{ steps.sel.outputs.rust }}
      rust-worker: ${{ steps.sel.outputs.rust-worker }}
      rust-spike: ${{ steps.sel.outputs.rust-spike }}
      full: ${{ steps.sel.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: sel
        name: Select test suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/ci_select.py select --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 tools/ci_select.py select --full
          fi

  # D-1751: public-pattern scrub over the whole tree. No --words and no private rules:
  # the private word list never enters CI; output is path:line:rule only. Runs on every change.
  scrub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: scrub_check (public patterns)
        run: python tools/split/scrub_check.py . --rules tools/split/manifest.toml --rules tools/split/scrub_ci.toml

  # AO-400LOC (D-3198): a file over 800 lines needs a .filesize-baseline entry
  # that only shrinks vs the base: PR origin/main, push the pushed-over sha, else HEAD~1.
  file-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env:
          FILESIZE_REQUIRE_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}
        run: python3 tools/check_file_size.py

  # D-4691: added production source must be Rust unless explicitly allowlisted.
  new-code-lang:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env:
          NEWCODE_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}
        run: python3 tools/check_new_code_lang.py

  # D-653: every change -> CHANGELOG.md + docs (.docs-map)
  changelog-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env:
          CHANGELOG_BASE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}
        run: python3 tools/check_changelog_docs.py

  pytest:
    needs: select
    if: needs.select.outputs.pytest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup-rust
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build fleet projection helper
        run: cargo build -j 2 --release -p pg-spawnd --manifest-path rust/Cargo.toml
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # D-1393: pip wheel cache keyed on the requirements hash.
      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('requirements-ci.txt') }}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt
      - uses: ./.github/actions/setup-temporal
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Restore verified gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-8.30.1
      # D-2557: release checksums or Go sumdb; no hard-coded digest or curl | sh.
      - name: Install gitleaks 8.30.1
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          if curl -fsSL -o "$dir/gitleaks_8.30.1_linux_x64.tar.gz" --retry 3 --retry-delay 5 \
              --retry-max-time 40 --retry-all-errors --connect-timeout 10 --max-time 20 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz && \
            curl -fsSL -o "$dir/gitleaks_8.30.1_checksums.txt" --retry 3 --retry-delay 5 \
              --retry-max-time 40 --retry-all-errors --connect-timeout 10 --max-time 20 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt; then
            # Missing checksum lines and mismatches fail closed, not into fallback.
            grep -E "^[0-9a-f]{64}  gitleaks_8\.30\.1_linux_x64\.tar\.gz$" "$dir/gitleaks_8.30.1_checksums.txt" > "$dir/checks.sha256"
            (cd "$dir" && sha256sum -c checks.sha256)
            tar -xzf "$dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$dir" gitleaks
            "$dir/gitleaks" version | grep -Fx 8.30.1
          else
            # Force proxy + public checksum database even if runner defaults differ.
            GOBIN="$dir" GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
              GOPRIVATE= GONOSUMDB= GONOPROXY= \
              go install github.com/zricethezav/gitleaks/v8@v8.30.1
            go version -m "$dir/gitleaks" | grep -F 'github.com/zricethezav/gitleaks/v8'
          fi
          mkdir -p ~/.local/bin
          install -m 0755 "$dir/gitleaks" ~/.local/bin/gitleaks
      - name: Workflow archive policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: b=$(git rev-parse --verify --end-of-options "HEAD^1^{commit}") && git show "$b":tests/test_workflow_archive.py > .git/workflow_archive_base.py && python .git/workflow_archive_base.py "$b"
      - name: pytest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/affected_tests.py --base "$BASE_SHA" --run -n auto
          else
            python -m pytest -q -n auto --dist loadgroup --durations=30 tests
          fi

  # UI-BROWSER-TESTS W1: headless Chromium only; CDN scripts are served from
  # committed local assets, so the job never needs network access to a CDN.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: browser tests
        run: python -m pytest -q tests/browser -m browser
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: out/ui-shots/*.png
          if-no-files-found: warn

  pytest-postgres:
    needs: select
    if: needs.select.outputs.pytest-postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keeper
        ports:
          - 5432
        # Per-test schemas grow PG16 shared statistics beyond Docker's 64 MiB default.
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_KEEPER_BACKEND: postgres
      # per-route keeper latency table at the end of the run (tests/contract/conftest.py)
      PG_CONTRACT_LATENCY_DIR: /tmp/pg-contract-latency
      # root-cause hunt (CI-PG-CONTRACT-TIMEOUT): on a hung request dump the keeper's thread stacks
      PG_CONTRACT_ABORT_ON_TIMEOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup-rust
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build fleet projection helper
        run: cargo build -j 2 --release -p pg-spawnd --manifest-path rust/Cargo.toml
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # D-1393: pip wheel cache keyed on the requirements hash.
      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('requirements-ci.txt') }}
      - name: Resolve Postgres service host
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        # On GitHub-hosted runners the service container is published on localhost.
        run: echo "PG_DSN=postgresql://postgres@localhost:$PG_PORT/keeper" >> "$GITHUB_ENV"
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt "psycopg[binary]"
      - uses: ./.github/actions/setup-temporal
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest (contract suite + keeper storage tests on Postgres)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # keeper modules that never open the SQLite file directly
          FILES=$(grep -lE "keeper_util|door_util|plangraph\.keeper|from plangraph import" tests/test_*.py \
                  | xargs grep -L sqlite3 | tr '\n' ' ')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/affected_tests.py --base "$BASE_SHA" --within tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py tests/test_projector_ddl.py tests/test_worker_claim.py tests/test_claim_parity_dispatch.py $FILES --run -n auto
            exit $?
          fi
          # test_projector_ddl.py names sqlite3 (its SQLite cases) but also carries the Postgres cases
          python -m pytest -q -n auto --dist loadgroup --durations=30 tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py \
            tests/test_projector_ddl.py tests/test_worker_claim.py tests/test_claim_parity_dispatch.py $FILES

  rust:
    needs: select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: Lint checked-in MCP settings permissions
        run: cargo run -p pg-hook --bin pg-settings-lint -- --tracked ..
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check (windows-gnu)
        run: cargo check --target x86_64-pc-windows-gnu -p pg-worker-core -p pg-spawnd --all-targets
      - name: Build pg-jail helper
        run: cargo build -p pg-jail
      - name: cargo test
        env:
          PG_JAIL_BIN: ${{ github.workspace }}/rust/target/debug/pg-jail
        run: cargo test

  rust-windows:
    needs: select
    if: needs.select.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: cargo test -p pg-spawnd
        run: cargo test -p pg-spawnd
      - name: cargo test -p pg-worker-core
        run: cargo test -p pg-worker-core

  rust-worker:
    needs: select
    if: needs.select.outputs.rust-worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust/worker
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/worker/target
          key: rust-worker-${{ runner.os }}-${{ hashFiles('rust/worker/Cargo.lock', 'rust/worker-core/Cargo.toml') }}
      - uses: ./.github/actions/setup-temporal
      - name: Start Temporal dev server
        run: |
          "$TEMPORAL_CLI" server start-dev --ip 127.0.0.1 --port 17233 > /tmp/temporal.log 2>&1 &
          for i in $(seq 1 30); do
            if "$TEMPORAL_CLI" operator cluster health --address 127.0.0.1:17233 2>/dev/null; then
              echo "Temporal server is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Temporal server failed to start"
              exit 1
            fi
            sleep 1
          done
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        env:
          PG_TEMPORAL_ADDR: http://127.0.0.1:17233
          # Unit tests run attempts without the jail helper; the jail is covered by the rust job.
          PG_JAIL: "off"
          PG_TEST_ALLOW_UNJAILED: "1"
        run: cargo test
      - name: Dev server log tail
        if: always()
        run: |
          if [ -f /tmp/temporal.log ]; then
            tail -n 100 /tmp/temporal.log
          fi

  rust-spike:
    needs: select
    if: needs.select.outputs.rust-spike == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: ./.github/actions/setup-rust
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/spikes/temporal-spike/target
          key: temporal-spike-${{ hashFiles('rust/spikes/temporal-spike/Cargo.lock') }}
      - name: cargo test replay
        run: cargo test --manifest-path rust/spikes/temporal-spike/Cargo.toml --test replay

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    needs: [select, scrub, file-size, new-code-lang, changelog-docs, pytest, pytest-postgres, rust, rust-worker, rust-spike]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci_select.py gate --needs "$NEEDS_JSON"
      # Use BASE: a PR cannot weaken the gate that judges it; L1 needs green ci-gate at merge.
      - name: Commit trailers
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "new ref: nothing to check"
            exit 0
          fi
          git show "$BASE:tools/ci_commit_gate.py" > "$RUNNER_TEMP/ci_commit_gate_base.py"
          python3 "$RUNNER_TEMP/ci_commit_gate_base.py" check --base "$BASE" --head "$HEAD" --exempt tools/ci_commit_exempt.txt
