name: tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "vendor/**"
      - "rust/**"
      - "requirements-ci.txt"
      - ".github/workflows/tests.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!CHANGELOG*"
  workflow_dispatch:

# CI runs only on PRs into main (operator order); a newer push to the PR cancels the stale run,
# but never a workflow_dispatch run (timing measurements must finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # D-1751: public-pattern scrub over the whole tree. No --words and no private rules:
  # the private word list never enters CI; output is path:line:rule only.
  scrub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scrub_check (public patterns)
        run: python tools/split/scrub_check.py . --rules tools/split/manifest.toml --rules tools/split/scrub_ci.toml

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # D-1393: pip wheel cache keyed on the requirements hash.
      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('requirements-ci.txt') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt
      - name: Install Temporal CLI 1.9.1
        run: |
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/temporal.tar.gz" \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $dir/temporal.tar.gz" | sha256sum -c -
          tar -xzf "$dir/temporal.tar.gz" -C "$dir" temporal
          echo "TEMPORAL_CLI=$dir/temporal" >> "$GITHUB_ENV"
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest
        run: python -m pytest -q -n auto --dist loadgroup --durations=30 tests

  pytest-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keeper
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_KEEPER_BACKEND: postgres
      # per-route keeper latency table at the end of the run (tests/contract/conftest.py)
      PG_CONTRACT_LATENCY_DIR: /tmp/pg-contract-latency
      # root-cause hunt (CI-PG-CONTRACT-TIMEOUT): on a hung request dump the keeper's thread stacks
      PG_CONTRACT_ABORT_ON_TIMEOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # D-1393: pip wheel cache keyed on the requirements hash.
      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('requirements-ci.txt') }}
      - name: Resolve Postgres service host
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        # On GitHub-hosted runners the service container is published on localhost.
        run: echo "PG_DSN=postgresql://postgres@localhost:$PG_PORT/keeper" >> "$GITHUB_ENV"
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt "psycopg[binary]"
      - name: Install Temporal CLI 1.9.1
        run: |
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/temporal.tar.gz" \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $dir/temporal.tar.gz" | sha256sum -c -
          tar -xzf "$dir/temporal.tar.gz" -C "$dir" temporal
          echo "TEMPORAL_CLI=$dir/temporal" >> "$GITHUB_ENV"
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest (contract suite + keeper storage tests on Postgres)
        run: |
          # keeper modules that never open the SQLite file directly
          FILES=$(grep -lE "keeper_util|door_util|plangraph\.keeper|from plangraph import" tests/test_*.py \
                  | xargs grep -L sqlite3 | tr '\n' ' ')
          # test_projector_ddl.py names sqlite3 (its SQLite cases) but also carries the Postgres cases
          python -m pytest -q -n auto --dist loadgroup --durations=30 tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py \
            tests/test_projector_ddl.py $FILES
