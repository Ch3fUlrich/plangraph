name: tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "vendor/**"
      - "requirements-ci.txt"
      - ".github/workflows/tests.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!CHANGELOG*"
  workflow_dispatch:

# CI runs only on PRs into main (operator order); a newer push to the PR cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: [self-hosted, workst]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System Python venv (setup-python's toolcache build lacks libpython on this runner image)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv python3-pip python3-dev build-essential
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest
        run: python -m pytest -q -n auto --dist loadgroup tests

  pytest-postgres:
    runs-on: [self-hosted, workst]
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keeper
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_KEEPER_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - name: System Python venv (setup-python's toolcache build lacks libpython on this runner image)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv python3-pip python3-dev build-essential
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Resolve Postgres service host
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        # Self-hosted runner: the job runs in a container and the service is a sibling
        # container on the host Docker, published on a random host port; 127.0.0.1 is the
        # runner container itself, so probe the host aliases instead.
        run: |
          for h in 127.0.0.1 host.docker.internal "$(ip route | awk '/default/{print $3; exit}')"; do
            [ -n "$h" ] || continue
            if timeout 3 bash -c "exec 3<>/dev/tcp/$h/$PG_PORT" 2>/dev/null; then
              echo "postgres reachable at $h:$PG_PORT"
              echo "PG_DSN=postgresql://postgres@$h:$PG_PORT/keeper" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no route to postgres service on port $PG_PORT" >&2
          exit 1
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt "psycopg[binary]"
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest (contract suite + keeper storage tests on Postgres)
        run: |
          # keeper modules that never open the SQLite file directly
          FILES=$(grep -lE "keeper_util|door_util|plangraph\.keeper|from plangraph import" tests/test_*.py \
                  | xargs grep -L sqlite3 | tr '\n' ' ')
          python -m pytest -q -n auto --dist loadgroup tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py tests/test_keeper_pg_copy.py $FILES
