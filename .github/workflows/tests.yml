name: tests

on:
  push:
    branches: [main]
  pull_request:

# D-1338: lane branches run CI via their PR only; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps
        run: python -m pip install --quiet -r requirements-ci.txt
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest
        run: python -m pytest -q -n auto --dist loadgroup tests

  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_KEEPER_BACKEND: postgres
      PG_DSN: postgresql://postgres@127.0.0.1:5432/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --quiet pytest pyyaml "cryptography>=41.0.7" "psycopg[binary]"
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest (contract suite + keeper storage tests on Postgres)
        run: |
          # keeper modules that never open the SQLite file directly
          FILES=$(grep -lE "keeper_util|door_util|plangraph\.keeper|from plangraph import" tests/test_*.py \
                  | xargs grep -L sqlite3 | tr '\n' ' ')
          python -m pytest -q tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py $FILES
