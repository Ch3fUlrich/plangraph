name: tests

on:
  push:
    branches: [main]
  pull_request:

# D-1338: lane branches run CI via their PR only; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps
        run: python -m pip install --quiet pytest pyyaml "cryptography>=41.0.7" temporalio
      - name: Install Temporal CLI 1.9.1
        run: |
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/temporal.tar.gz" \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $dir/temporal.tar.gz" | sha256sum -c -
          tar -xzf "$dir/temporal.tar.gz" -C "$dir" temporal
          echo "TEMPORAL_CLI=$dir/temporal" >> "$GITHUB_ENV"
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest
        run: python -m pytest -q tests

  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_KEEPER_BACKEND: postgres
      PG_DSN: postgresql://postgres@127.0.0.1:5432/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --quiet pytest pyyaml "cryptography>=41.0.7" "psycopg[binary]" temporalio
      - name: Install Temporal CLI 1.9.1
        run: |
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/temporal.tar.gz" \
            https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          echo "09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  $dir/temporal.tar.gz" | sha256sum -c -
          tar -xzf "$dir/temporal.tar.gz" -C "$dir" temporal
          echo "TEMPORAL_CLI=$dir/temporal" >> "$GITHUB_ENV"
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "plangraph-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: pytest (contract suite + keeper storage tests on Postgres)
        run: |
          # keeper modules that never open the SQLite file directly
          FILES=$(grep -lE "keeper_util|door_util|plangraph\.keeper|from plangraph import" tests/test_*.py \
                  | xargs grep -L sqlite3 | tr '\n' ' ')
          # test_projector_ddl.py names sqlite3 (its SQLite cases) but also carries the Postgres cases
          python -m pytest -q tests/contract tests/test_keeper_pg_unit.py tests/test_keeper_pg_parity.py \
            tests/test_keeper_pg_copy.py tests/test_projector_ddl.py $FILES
