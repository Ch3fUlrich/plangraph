name: rust-spike

# Offline tests of the Temporal SDK spike (history replay; no server needed).

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/spikes/**"
      - ".github/workflows/rust-spike.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!CHANGELOG*"
  workflow_dispatch:

# CI runs only on PRs into main (operator order); a newer push to the PR cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  temporal-spike:
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc and build tools (protoc is needed by the Temporal protos build script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: rust/spikes/temporal-spike/target
          key: temporal-spike-${{ hashFiles('rust/spikes/temporal-spike/Cargo.lock') }}
      - name: Offline replay tests
        run: cargo test --manifest-path rust/spikes/temporal-spike/Cargo.toml --test replay
