name: rust-spike

# Offline tests of the Temporal SDK spike (history replay; no server needed).

on:
  push:
    paths:
      - "rust/spikes/**"
      - ".github/workflows/rust-spike.yml"
  pull_request:
    paths:
      - "rust/spikes/**"
      - ".github/workflows/rust-spike.yml"

permissions:
  contents: read

jobs:
  temporal-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (needed by the Temporal protos build script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: rust/spikes/temporal-spike/target
          key: temporal-spike-${{ hashFiles('rust/spikes/temporal-spike/Cargo.lock') }}
      - name: Offline replay tests
        run: cargo test --manifest-path rust/spikes/temporal-spike/Cargo.toml --test replay
