name: rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "!rust/spikes/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "!rust/spikes/**"
      - ".github/workflows/rust.yml"

# D-1338: lane branches run CI via their PR only; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: [self-hosted, workst]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Build tools (the self-hosted runner image has no C toolchain)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
