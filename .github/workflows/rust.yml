name: rust

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "!rust/spikes/**"
      - "!rust/worker/**"
      - ".github/workflows/rust.yml"
      - "!**/*.md"
      - "!docs/**"
      - "!CHANGELOG*"
  workflow_dispatch:

# CI runs only on PRs into main (operator order); a newer push to the PR cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: [self-hosted, workst]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Build tools (the self-hosted runner image has no C toolchain)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
