version = 1

[[rules]]
name = "HostMemoryFloor"
unit = "MIB"
kind = "u64"
default = 6144
min = 0
max = 1048576
alarm = 3000
overrides = ["process", "env_file", "keeper_host", "keeper_fleet"]
host_seeds = {}

[[rules]]
name = "HostWorkerCap"
unit = "COUNT"
kind = "u64"
default = 6
min = 0
max = 1024
overrides = ["process", "env_file", "keeper_host", "keeper_fleet"]
host_seeds = { dispatch_vm = 4, prox = 5 }
