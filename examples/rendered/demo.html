<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Read-only plan graph: dependencies, ready and blocked work, critical path.">
<title>plangraph example</title>
<style>
/* plangraph page — self-contained. No external fonts or images.
   Colour tokens come from the Okabe–Ito colour-blind-safe palette (see page.js
   for the equivalent JS fallbacks). Text colours are chosen per fill so every
   state label keeps a contrast ratio of at least 4.5:1. */

:root {
  --bg: #f6f6f4;
  --fg: #15171c;
  --muted: #5b616e;
  --panel: #ffffff;
  --border: #d5d8de;
  --accent: #33415c;

  /* display states (Okabe–Ito) + contrast-safe label colour */
  --state-ready: #009e73;        --state-ready-fg: #05170f;
  --state-blocked: #d55e00;      --state-blocked-fg: #1a0d00;
  --state-claimed: #56b4e9;      --state-claimed-fg: #062033;
  --state-in_review: #0072b2;    --state-in_review-fg: #ffffff;
  --state-open: #e69f00;         --state-open-fg: #1a1200;
  --state-done: #9e9e9e;         --state-done-fg: #15171c;
  --state-cancelled: #cfcfcf;    --state-cancelled-fg: #45484f;
  --state-start: #33415c;        --state-start-fg: #ffffff;

  --critical: #cc79a7;
  --group: #5b616e;
}

@media (prefers-color-scheme: dark) {
  :root {
  --bg: #0f1216;
  --fg: #e8eaee;
  --muted: #a6b1c2;
  --panel: #171b21;
  --border: #5a6a80;
  --accent: #9fb4d8;

    --state-ready: #0e7c5a;      --state-ready-fg: #ffffff;
    --state-blocked: #b84a00;    --state-blocked-fg: #ffffff;
    --state-claimed: #2e7fb0;    --state-claimed-fg: #ffffff;
    --state-in_review: #00527f;  --state-in_review-fg: #ffffff;
    --state-open: #b8860b;       --state-open-fg: #0b0b0b;
    --state-done: #555b64;       --state-done-fg: #e8eaee;
    --state-cancelled: #3a3f47;  --state-cancelled-fg: #b9bfc9;
    --state-start: #9fb4d8;      --state-start-fg: #0b0f14;

    --critical: #cc79a7;
    --group: #9aa3b2;
  }
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

[hidden] { display: none !important; }

/* ---- header -------------------------------------------------------------- */
.top {
  display: flex;
  flex-wrap: nowrap;
  gap: 12px 16px;
  align-items: center;
  padding: 6px 16px;
  min-height: 52px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.top-title h1 { font-size: 15px; margin: 0; }
.top-title .sub { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
.searchwrap { display: flex; align-items: center; }
#search {
  width: min(280px, 30vw); height: 32px; padding: 4px 10px;
  font: inherit; font-size: 13px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
}
.progress { flex: 0 1 200px; min-width: 140px; }
.progress .bar {
  height: 8px; border-radius: 999px; overflow: hidden;
  background: color-mix(in srgb, var(--border) 70%, transparent);
}
.progress .bar span { display: block; height: 100%; width: 0; background: var(--state-ready); }
.progress .pct { margin: 3px 0 0; font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ---- view tabs: top-level nav inside the header (P1) ---------------------- */
.tabs { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; padding: 0; }
.tabs button {
  appearance: none; cursor: pointer;
  min-height: 32px; padding: 4px 14px; font: inherit; font-size: 13px; font-weight: 500;
  background: transparent; color: var(--muted);
  border: 1px solid transparent; border-radius: 8px;
}
.tabs button.active {
  font-weight: 700; color: var(--fg); background: var(--bg);
  border-color: var(--border); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
}
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

/* ---- panels -------------------------------------------------------------- */
.tabpanel { background: var(--panel); border-top: 1px solid var(--border); }
.graph-wrap { position: relative; }
.empty { margin: 0; padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---- legend -------------------------------------------------------------- */
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 8px 16px; border-top: 1px solid var(--border); font-size: 12px;
}
.legend-title { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; }

/* ---- details panel ------------------------------------------------------- */
.details {
  position: fixed; top: 0; right: 0; z-index: 30;
  width: min(420px, 92vw); height: 100vh; overflow: auto;
  background: var(--panel); border-left: 1px solid var(--border);
  box-shadow: -8px 0 24px rgba(0, 0, 0, .18);
  padding: 14px 16px 48px;
}
.details-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.details-head h2 { font-size: 15px; margin: 0; word-break: break-all; }
.details-close {
  appearance: none; cursor: pointer; font: inherit; font-size: 16px; line-height: 1;
  min-height: 32px; min-width: 32px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: transparent; color: var(--fg);
  border-radius: 6px; padding: 0;
}
.details-close:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
.details-title { margin: 6px 0 10px; font-weight: 600; }
.fields { gap: 6px 12px; }
.fields dt { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.fields dd { font-size: 13px; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--border); color: var(--fg); }
.badge-kind, .badge-op, .badge-critical { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.badge-ready { background: var(--state-ready); color: var(--state-ready-fg); border-color: transparent; }
.badge-blocked { background: var(--state-blocked); color: var(--state-blocked-fg); border-color: transparent; }
.badge-claimed { background: var(--state-claimed); color: var(--state-claimed-fg); border-color: transparent; }
.badge-in_review { background: var(--state-in_review); color: var(--state-in_review-fg); border-color: transparent; }
.badge-open { background: var(--state-open); color: var(--state-open-fg); border-color: transparent; }
.badge-done { background: var(--state-done); color: var(--state-done-fg); border-color: transparent; }
.badge-cancelled { background: var(--state-cancelled); color: var(--state-cancelled-fg); border-color: transparent; }
.fields { display: grid; grid-template-columns: minmax(90px, 34%) 1fr; gap: 3px 10px; margin: 0; }
.fields dt { color: var(--muted); font-size: 12px; }
.fields dd { margin: 0; word-break: break-word; }
.keys { display: flex; flex-wrap: wrap; gap: 5px; }
.keylink {
  appearance: none; cursor: pointer; font: inherit; font-size: 12px;
  border: 1px solid var(--border); background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--fg); border-radius: 6px; padding: 1px 7px;
}
.keylink.unknown { opacity: .6; cursor: not-allowed; text-decoration: line-through; }
.details h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 4px; }
.details .criteria { margin: 0; }
.evidence { list-style: none; margin: 0; padding: 0; }
.evidence li { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.ev-ref { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.ev-ok { color: var(--state-ready); font-size: 12px; }
.ev-kind { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }

/* ---- list view ----------------------------------------------------------- */
#list-content { padding: 12px 16px 48px; max-width: 900px; margin: 0 auto; }
.list-h { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; border-left-width: 6px; }
.row-ready { border-left-color: var(--state-ready); }
.row-blocked { border-left-color: var(--state-blocked); }
.row-claimed { border-left-color: var(--state-claimed); }
.row-in_review { border-left-color: var(--state-in_review); }
.row-open { border-left-color: var(--state-open); }
.row-done { border-left-color: var(--state-done); }
.row-cancelled { border-left-color: var(--state-cancelled); }
.row-main {
  display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left;
  appearance: none; cursor: pointer; font: inherit; color: var(--fg);
  background: transparent; border: 0; padding: 9px 12px;
}
.row-main:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.row-key { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
.row-title { font-weight: 600; }
.row-meta { font-size: 12px; color: var(--muted); }
.row-blockers { padding: 0 12px 9px; font-size: 12px; color: var(--state-blocked); }

@media (max-width: 700px) {
  /* P4: single-row scrolling chip groups instead of a stacked block that
     pushes the canvas below the fold; the duplicate quick-filter row goes. */
  .control-group { flex-wrap: nowrap; }
  .chips { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .chip { flex: 0 0 auto; min-height: 32px; padding: 4px 12px; }
  .focus-chip-row { display: none !important; }
}

/* Densified desktop size tiers (P3): the 44 px floor stays for touch
   (<= 700 px); pointer targets tier down to 36/32/28 px. */
@media (min-width: 701px) {
  .chip { min-height: 28px; min-width: 28px; }
  .jump { min-height: 28px; min-width: 28px; padding: 3px 10px; font-size: 12px; }
  .icon-btn { min-height: 36px; min-width: 36px; padding: 4px 10px; }
  #sb-toggle { min-height: 32px; min-width: 32px; padding: 4px 12px; font-size: 13px; }
  .sb-tab { min-height: 38px; }
  .seg button { min-height: 32px; }
  .dp-act button { min-height: 36px; }
  .set-row { min-height: 36px; }
  input[type="checkbox"], input[type="radio"] { min-width: 20px; min-height: 20px; }
}

/* When the details panel docks on a mid-size screen, collapse the sidebar to
   the icon rail so the canvas keeps its width share (P6). */
@media (min-width: 701px) and (max-width: 1439px) {
  body:has(#details:not([hidden])) #sidebar { flex-basis: var(--rail-w); width: var(--rail-w); }
  body:has(#details:not([hidden])) .sb-label,
  body:has(#details:not([hidden])) .sb-panel,
  body:has(#details:not([hidden])) .sb-body { display: none; }
  body:has(#details:not([hidden])) .sb-tab { justify-content: center; gap: 4px; padding: 8px 4px; }
  body:has(#details:not([hidden])) .sb-count {
    position: absolute; margin-left: 26px; margin-top: -18px;
    min-width: 18px; font-size: 10px; padding: 0 4px;
  }
}

/* ---- sidebar Projects tab: project > phase > task tree --------------------- */
.ptree { margin-top: 8px; }
.pt-list { list-style: none; margin: 0; padding: 0; }
.pt-list .pt-list { margin-left: 14px; padding-left: 6px; border-left: 2px solid color-mix(in srgb, var(--pc, var(--border)) 45%, transparent); }
.pt-node { margin: 3px 0; }
.pt-line { display: flex; align-items: stretch; gap: 4px; }
.pt-row { appearance: none; cursor: pointer; font: inherit; text-align: left; display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%; }
.pt-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-count { flex: 0 0 auto; font-size: 11px; opacity: .85; }
.pt-chev { flex: 0 0 12px; font-size: 11px; }
.pt-project-row { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--pc); background: var(--pc); color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 1px rgba(0,0,0,.45); }
.pt-phase-row { padding: 5px 8px; border-radius: 6px; border: 1.5px solid var(--pc); font-size: 12px; color: var(--fg);
  background: linear-gradient(to right, color-mix(in srgb, var(--pc) 55%, var(--panel)) var(--pct, 0%), var(--panel) var(--pct, 0%)); }
.pt-row.off { opacity: .45; }
.pt-eye { appearance: none; cursor: pointer; flex: 0 0 24px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--fg); font-size: 13px; line-height: 1; }
.pt-eye.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.pt-task-row { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); border-left: 5px solid var(--pc); background: var(--panel); color: var(--fg); font-size: 12px; }
.pt-task-row.kind-gate { border-radius: 2px; clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%); padding-left: 12px; padding-right: 12px; }
.pt-task-row.kind-goal { border-width: 2px; border-left-width: 5px; border-color: var(--critical, #cc79a7); }
.pt-task-row.state-ready { box-shadow: inset 0 -3px 0 var(--state-ready); }
.pt-task-row.state-blocked { box-shadow: inset 0 -3px 0 var(--state-blocked); }
.pt-task-row.state-claimed { box-shadow: inset 0 -3px 0 var(--state-claimed); }
.pt-task-row.state-in_review { box-shadow: inset 0 -3px 0 var(--state-in_review); }
.pt-task-row.state-open { box-shadow: inset 0 -3px 0 var(--state-open); }
.pt-task-row.state-done { box-shadow: inset 0 -3px 0 var(--state-done); opacity: .7; }
.pt-task-row.state-cancelled { box-shadow: inset 0 -3px 0 var(--state-cancelled); opacity: .55; text-decoration: line-through; }
.pt-sym { flex: 0 0 16px; text-align: center; font-size: 14px; color: var(--pc); }
.pt-crit { flex: 0 0 auto; color: var(--critical, #cc79a7); }
.pt-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 6px; font-size: 11px; color: var(--muted); }
.pt-row:focus-visible, .pt-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (pointer: coarse) { .pt-row, .pt-eye { min-height: 40px; } }

/* ---- table page: groupable dense tables ------------------------------------- */
#panel-list { padding: 8px 12px 24px; }
.tt-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 8px; font-size: 12px; }
.tt-sel { font: inherit; font-size: 12px; padding: 2px 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
.tt-count { color: var(--muted); }
.tt-btn, .tg-more { appearance: none; cursor: pointer; font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); }
.tg { margin: 0 0 12px; border: 1px solid var(--border); border-left: 4px solid var(--pc, var(--accent)); border-radius: 6px; background: var(--panel); }
.tg-head { display: flex; align-items: center; gap: 10px; padding: 5px 10px; position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--pc, var(--accent)) 14%, var(--panel)); border-radius: 6px 6px 0 0; }
.tg-toggle { appearance: none; border: 0; background: transparent; color: var(--fg); cursor: pointer; font-size: 13px; padding: 0 4px; }
.tg-name { font-weight: 700; font-size: 13px; }
.tg-count, .tg-pct { font-size: 11px; color: var(--muted); }
.tg-bar { flex: 0 1 220px; min-width: 80px; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-left: auto; }
.tg-bar i { display: block; height: 100%; background: var(--pc, var(--state-ready)); }
.tg-scroll { overflow-x: auto; }
.tt { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 1.25; }
.tt th, .tt td { padding: 3px 8px; text-align: left; vertical-align: top; border-top: 1px solid var(--border); }
.tt thead th { position: sticky; top: 0; background: var(--panel); font-size: 11px; color: var(--muted); white-space: nowrap; border-top: 0; }
.th-btn { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0; }
.th-btn.on { color: var(--fg); font-weight: 700; }
.tr { border-left: 3px solid var(--pc, transparent); }
.tr:hover, .tr.sel { background: color-mix(in srgb, var(--pc, var(--accent)) 12%, transparent); }
.tr.state-done { opacity: .7; } .tr.state-cancelled { opacity: .5; text-decoration: line-through; }
.tc-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc, #888); margin-right: 5px; }
.tc-proj, .tc-phase, .tc-agent { white-space: nowrap; }
.tc-task { min-width: 220px; }
.tc-open { appearance: none; border: 0; background: transparent; color: var(--fg); font: inherit; cursor: pointer; text-align: left; padding: 0; display: inline-flex; gap: 6px; max-width: 360px; }
.tc-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-sym { color: var(--pc, var(--muted)); flex: 0 0 14px; text-align: center; }
.tc-go { appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 13px; }
.tc-badge { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; background: var(--state-open); color: var(--state-open-fg); }
.b-ready { background: var(--state-ready); color: var(--state-ready-fg); } .b-blocked { background: var(--state-blocked); color: var(--state-blocked-fg); }
.b-claimed { background: var(--state-claimed); color: var(--state-claimed-fg); } .b-in_review { background: var(--state-in_review); color: var(--state-in_review-fg); }
.b-done { background: var(--state-done); color: var(--state-done-fg); } .b-cancelled { background: var(--state-cancelled); color: var(--state-cancelled-fg); }
.tc-when { white-space: nowrap; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tc-links { white-space: nowrap; }
.tl-item, .tl-chip { appearance: none; cursor: pointer; font: inherit; font-size: 11px; padding: 0 6px; margin-right: 3px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--fg); }
.tl-decision { border-color: var(--state-in_review); } .tl-question { border-color: var(--state-open); border-style: dashed; }
.tl-more { font-size: 11px; color: var(--muted); }
.pg-pop { position: fixed; z-index: 90; width: 320px; max-width: calc(100vw - 16px); padding: 8px 10px; border-radius: 8px; background: var(--panel); color: var(--fg); border: 1px solid var(--accent); box-shadow: 0 8px 28px rgba(0,0,0,.35); font-size: 12px; pointer-events: none; }
.pg-pop[hidden] { display: none; }
.pg-pop-h { display: flex; gap: 8px; font-weight: 700; margin-bottom: 4px; } .pg-pop-kind { font-weight: 400; color: var(--muted); }
.pg-pop-t { font-weight: 600; margin-bottom: 3px; } .pg-pop-a { margin-top: 4px; color: var(--state-ready); } .pg-pop-m { margin-top: 5px; color: var(--muted); font-size: 11px; }
#list-content { max-width: none; margin: 0; padding: 0; }
.tt button, .tg button, .tt-bar button, .tt-bar select { min-height: 0; min-width: 0; }
@media (pointer: coarse) { .tt button, .tg button { min-height: 32px; } }
.tabs .sb-count { margin-left: 6px; }

/* ---- Decisions & Q&A page ---------------------------------------------------- */
.pg-h { font-size: 14px; margin: 14px 0 6px; }
.pg-h:first-child { margin-top: 0; }
.qa-t { border: 1px solid var(--border); border-radius: 6px; }
.qa-text { min-width: 280px; max-width: 520px; }
.qa-ans { margin-top: 3px; color: var(--state-ready); }
.qa-edit { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.qa-ta { flex: 1 1 100%; font: inherit; font-size: 12px; padding: 4px 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; min-height: 0; }
.qa-proj { display: inline-flex; align-items: center; margin-right: 8px; white-space: nowrap; }
.qa-export { margin: 6px 0; }
tr.flash { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.pg-body .seg { margin: 4px 0; }

/* plangraph page chrome (T2) — loaded AFTER page.css, so it wins the cascade.
   UI-PLAN §11: root 16 px (S 15 / L 18), project palette P1–P8, state palette
   kept as tokens, focus ring 2 px, light/dark both preserved — the palettes
   below are byte-identical to page.css, restated ONLY so an explicit
   `data-theme="light|dark"` can force one mode against `prefers-color-scheme`.
   §10 phone shell: 48 px header, 56 px bottom tab bar + safe area, 44 px
   targets, no horizontal scroll. All colours are CSS variables; no url(),
   no @import, no external fonts or images. */

/* ---- project palette P1–P8 (page_model COLORS) + chrome metrics --------- */
:root {
  --p1: #2f6f4f;  --p2: #3b5bdb;  --p3: #b45309;  --p4: #7c3aed;
  --p5: #0e7490;  --p6: #be123c;  --p7: #4d7c0f;  --p8: #6d28d9;

  --sb-w: 260px;          /* docked sidebar (§9) */
  --rail-w: 56px;         /* collapsed icon rail */
  --dp-w: 320px;          /* docked DetailPanel (§9, A10) */
  --sheet-peek: 120px;    /* BottomSheet peek snap (§10, P4) */
  --tabbar-h: 56px;       /* phone bottom tab bar (§10) */
  --header-h: 48px;       /* phone header (§10) */
}

/* ---- text size: S = 15 px, M = 16 px, L = 18 px root (§11) -------------- */
html { font-size: 16px; }
html[data-textsize="S"] { font-size: 15px; }
html[data-textsize="L"] { font-size: 18px; }

body {
  font-size: 1rem;
  line-height: 1.4;
  overflow-x: hidden;      /* P-ok: never a horizontal page scroll */
}

/* ---- forced light (system says dark, settings say light) ---------------- */
@media (prefers-color-scheme: dark) {
  html[data-theme="light"] {
    --bg: #f6f6f4; --fg: #15171c; --muted: #5b616e; --panel: #ffffff;
    --border: #d5d8de; --accent: #33415c; --group: #5b616e;
    --state-ready: #009e73;     --state-ready-fg: #05170f;
    --state-blocked: #d55e00;   --state-blocked-fg: #1a0d00;
    --state-claimed: #56b4e9;   --state-claimed-fg: #062033;
    --state-in_review: #0072b2; --state-in_review-fg: #ffffff;
    --state-open: #e69f00;      --state-open-fg: #1a1200;
    --state-done: #9e9e9e;      --state-done-fg: #15171c;
    --state-cancelled: #cfcfcf; --state-cancelled-fg: #45484f;
    --state-start: #33415c;     --state-start-fg: #ffffff;
    --critical: #cc79a7;
  }
}

/* ---- forced dark (system says light, settings say dark) ----------------- */
html[data-theme="dark"] {
  --bg: #0f1216; --fg: #e8eaee; --muted: #a6b1c2; --panel: #171b21;
  --border: #5a6a80; --accent: #9fb4d8; --group: #9aa3b2;
  --state-ready: #0e7c5a;     --state-ready-fg: #ffffff;
  --state-blocked: #b84a00;   --state-blocked-fg: #ffffff;
  --state-claimed: #2e7fb0;   --state-claimed-fg: #ffffff;
  --state-in_review: #00527f; --state-in_review-fg: #ffffff;
  --state-open: #b8860b;      --state-open-fg: #0b0b0b;
  --state-done: #555b64;      --state-done-fg: #e8eaee;
  --state-cancelled: #3a3f47; --state-cancelled-fg: #b9bfc9;
  --state-start: #9fb4d8;     --state-start-fg: #0b0f14;
  --critical: #cc79a7;
}

/* ---- accessibility: 2 px focus ring on every control ------------------- */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
:focus:not(:focus-visible) { outline: none; }

/* ---- hit targets: 44 × 44 minimum at BOTH viewports (D3, A11) ---------- */
button, input, select, textarea { min-height: 44px; min-width: 44px; }

/* ---- header: search field + icon buttons ------------------------------- */
.top { position: relative; align-items: center; gap: 10px 16px; padding: 10px 16px; }
.top-title { min-width: 0; }
.top-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.searchwrap { display: flex; align-items: center; }
#search {
  width: min(340px, 42vw); height: 34px; padding: 4px 10px;
  font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
}
.icon-btn {
  appearance: none; cursor: pointer; font: inherit; font-size: 13px;
  min-height: 44px; min-width: 44px; padding: 4px 12px;
  color: var(--fg); background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px;
}
.icon-btn[aria-expanded="true"] { background: var(--accent); color: var(--bg); }
.phone-only { display: none; }

/* ---- layout grid: sidebar | main | docked details (app shell: chrome fixed,
   .layout fills the remaining viewport, every column scrolls internally) --- */
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; }
.layout {
  display: flex;
  align-items: stretch;      /* every column spans the row height */
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}
.layout > main {
  flex: 1 1 auto; min-width: 0;          /* A10: #cy clip edge */
  display: flex; flex-direction: column;
  overflow-y: auto; overscroll-behavior: contain;
}
#panel-graph {
  flex: 1 1 auto; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column;
}
#panel-graph .graph-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
#cy { flex: 1 1 0; min-height: 220px; touch-action: none; }
.t4-note {
  margin: 0; padding: 8px 16px; font-size: 12px; color: var(--fg);
  background: color-mix(in srgb, var(--accent) 15%, var(--panel));
  border-bottom: 1px solid var(--border);
}

#sidebar {
  flex: 0 0 var(--sb-w); width: var(--sb-w); min-width: 0;
  display: flex; flex-direction: column;
  height: 100%; max-height: 100%;
  background: var(--panel); border-right: 1px solid var(--border);
  overflow: hidden;
}
.sb-close { display: none; }
.sb-tabs { display: flex; flex-direction: column; flex: 0 0 auto; border-bottom: 1px solid var(--border); }
.sb-tab {
  appearance: none; cursor: pointer; font: inherit; text-align: left;
  position: relative;                             /* rail badge is absolute */
  display: flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 8px 12px;
  color: var(--muted); background: transparent;
  border: 0; border-bottom: 2px solid transparent;
}
.sb-tab:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.sb-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.sb-ico {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
}
.sb-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-count {
  flex: 0 0 auto; min-width: 24px; text-align: center;
  font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
  background: var(--accent); color: var(--bg);
}
.sb-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.sb-panel { padding: 10px 12px 24px; }
.sb-h {
  margin: 14px 0 6px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted);
}
.sb-h:first-child { margin-top: 2px; }
.sb-empty { margin: 8px 0; font-size: 13px; color: var(--muted); }

/* Needs You rows: title first, project dot, Jump button (§9) */
.ny-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 6px; border-bottom: 1px dashed var(--border);
}
.ny-main { flex: 1 1 auto; min-width: 0; }
.ny-title { display: block; font-weight: 600; overflow-wrap: anywhere; }
.ny-meta { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ny-dot {
  flex: 0 0 auto; width: 10px; height: 10px; margin-top: 5px;
  border-radius: 50%; background: var(--muted);
}
.jump {
  appearance: none; cursor: pointer; font: inherit; font-size: 12px;
  min-height: 44px; min-width: 44px; padding: 3px 10px;
  color: var(--fg); background: transparent;
  border: 1px solid var(--border); border-radius: 999px;
}
.jump:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* sortable tables (Decisions / Q&A) */
.sb-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
.sb-table th, .sb-table td {
  padding: 5px 6px; text-align: left; vertical-align: top;
  border-bottom: 1px solid var(--border); overflow-wrap: anywhere;
}
.sb-table th button {
  appearance: none; cursor: pointer; font: inherit; font-size: 11px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
  color: var(--muted); background: none; border: 0; padding: 4px 0;
}
.sb-table th[aria-sort] button { color: var(--fg); }
.sb-table tr:last-child td { border-bottom: 0; }
.col-id { width: 22%; } .col-proj { width: 17%; } .col-date { width: 16%; }
.col-status { width: 20%; } .col-links { width: 25%; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 0 0 8px; }
.seg button {
  appearance: none; cursor: pointer; font: inherit; font-size: 12px;
  min-height: 44px; min-width: 44px; padding: 4px 12px;
  color: var(--muted); background: transparent; border: 0;
  border-right: 1px solid var(--border);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }

/* Answers */
.ans-row { padding: 8px 6px; border-bottom: 1px dashed var(--border); }
.ans-q { display: block; font-weight: 600; overflow-wrap: anywhere; }
.ans-a { display: block; margin-top: 3px; color: var(--muted); overflow-wrap: anywhere; }
.ans-meta { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }

/* Settings */
.set-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; min-height: 44px; border-bottom: 1px dashed var(--border);
}
.set-row label { flex: 1 1 auto; font-size: 13px; }
.set-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.set-block { margin: 10px 0 4px; }
.set-block .sb-h { margin-top: 0; }

/* ---- DetailPanel: docked 380 px, never over #cy (§9, A10/D4) ----------- */
#details.details {
  position: sticky; top: 0; right: auto;
  flex: 0 0 var(--dp-w); width: var(--dp-w);
  height: auto; max-height: 100vh;
  box-shadow: none;                 /* docked column, not an overlay */
  padding: 12px 14px 28px;
  z-index: 5;
}
.dp-handle { display: none; }
.dp-crumb {
  margin: 2px 0 0; font-size: 12px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#details .details-title { font-size: 18px; margin: 8px 0 10px; }
.dp-act { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.dp-act button {
  appearance: none; cursor: pointer; font: inherit; font-size: 13px;
  min-height: 44px; min-width: 44px; padding: 5px 12px;
  color: var(--fg); background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px;
}
.dp-act button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.dp-loop {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: color-mix(in srgb, var(--critical) 12%, transparent);
}
.dp-k {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px; color: var(--muted);
}

/* ---- scrim + phone tab bar ---------------------------------------------- */
#sb-scrim { position: fixed; inset: 0; z-index: 34; background: rgba(0, 0, 0, .45); }
#tabbar { display: none; }

/* ---- sidebar: always docked ≥ 701 px, user-resizable via #sb-resize ------ */
.sb-resize {
  flex: 0 0 6px; margin-left: -3px; z-index: 5; cursor: col-resize; touch-action: none;
  background: transparent; border-left: 1px solid var(--border);
}
.sb-resize:hover, .sb-resize:focus-visible, body.sb-resizing .sb-resize { background: var(--accent); border-left-color: var(--accent); outline: none; }
body.sb-resizing { cursor: col-resize; user-select: none; }
.pg { padding: 12px 16px 28px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.pg[hidden] { display: none; }

/* ---- ≤ 700 px phone shell (§10, P1–P5) --------------------------------- */
@media (max-width: 700px) {
  .phone-only { display: inline-flex; }
  .desktop-only { display: none !important; }
  .searchwrap { display: none; }
  body[data-search="1"] .searchwrap {
    display: flex; position: absolute; top: 100%; left: 0; right: 0; z-index: 40;
    padding: 6px 12px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  #search { width: 100%; height: 44px; font-size: 16px; }  /* 16 px kills iOS zoom */

  .top { min-height: var(--header-h); padding: 6px 10px; gap: 8px; }
  .top-title h1 { font-size: 15px; }
  .progress { display: none; }
  .tabs { display: none; }              /* the bottom tab bar replaces them */
  .sb-resize { display: none; }
  .chip { min-height: 44px; display: inline-flex; align-items: center; padding: 6px 14px; }
  #cy { height: 64vh; }

  body { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }

  #tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .tab-btn {
    appearance: none; cursor: pointer; font: inherit; font-size: 12px;
    flex: 1 1 0; min-height: var(--tabbar-h); position: relative;
    color: var(--muted); background: transparent; border: 0;
  }
  .tab-btn[aria-current="page"] { color: var(--fg); font-weight: 700; }
  .tab-btn[aria-current="page"]::after {
    content: ""; position: absolute; left: 20%; right: 20%; bottom: 4px;
    height: 2px; background: var(--accent);
  }
  .tab-badge {
    position: absolute; top: 6px; left: 60%;
    min-width: 20px; padding: 1px 5px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-align: center;
    background: var(--state-open); color: var(--state-open-fg);
  }

  /* Inbox/Menu: an off-canvas drawer (~80 % width, P2) — not a full-screen
     takeover. Keeps D5b (own >= 44 px close control) and D5d (only .sb-body
     scrolls; page locked). */
  #sidebar { display: none; }
  body[data-screen="menu"] #sidebar {
    display: flex; position: fixed;
    top: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); left: 0;
    width: 82vw; max-width: 340px; flex-basis: auto;
    z-index: 20;                      /* overlay sits UNDER the tab bar (30) */
    border-right: 1px solid var(--border);
    box-shadow: 6px 0 24px rgba(0, 0, 0, .4);
  }
  /* D5b: the overlay gets its own ≥ 44 px close control, back to Graph */
  body[data-screen="menu"] #sb-close {
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto; align-self: flex-end;
    min-height: 44px; min-width: 44px; margin: 6px 8px 0 0;
    font: inherit; font-size: 16px; cursor: pointer;
    color: var(--fg); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px;
  }
  /* D5d: the overlay owns the ONLY scrollbar: window page, body and the
     sheet are locked while it is open — only .sb-body scrolls. */
  body[data-screen="menu"] { overflow: hidden; }
  body[data-screen="menu"] #details { display: none; }
  #sb-scrim { display: none; }

  /* BottomSheet: 120 px peek / 50 vh / 60 vh full (P4 + P7: never occlude
     more than 60 % of the graph context) */
  #details.details {
    position: fixed; left: 0; right: 0; top: auto;
    bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));   /* over the graph, under the bar */
    width: 100%; max-width: 100%;
    flex: none; height: var(--sheet-peek); max-height: 60vh;
    border-left: 0; border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, .2);
    padding: 6px 14px 16px;
    overflow: auto;
    z-index: 40;
  }
  #details.bottom-sheet[data-snap="half"] { height: 50vh; }
  #details.bottom-sheet[data-snap="full"] { height: 60vh; overflow: auto; }
  .dp-handle {
    display: flex; align-items: center; justify-content: center;
    position: sticky; top: 0; z-index: 2;
    width: 100%; min-height: 44px; margin: 0 0 4px;
    color: var(--muted); background: transparent;
    border: 0; border-radius: 8px; cursor: grab;
  }
  .dp-handle::before {
    content: ""; width: 44px; height: 4px; border-radius: 999px;
    background: var(--muted); opacity: .6;
  }

  /* ≥ 44 px targets everywhere on the phone (P2, A11) */
  button, input, select, textarea { min-height: 44px; font-size: 16px; }
  input[type="checkbox"], input[type="radio"] { min-width: 44px; }
  .jump, .keylink { min-height: 44px; display: inline-flex; align-items: center; padding: 6px 14px; }
  .seg button { min-height: 44px; }
  .icon-btn { min-height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---- Activity page (D-696): range presets, per-project counts, groups --- */
.act-range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.act-range button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.act-counts{width:100%;border-collapse:collapse;font-size:12px}
.act-counts th,.act-counts td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--border);overflow-wrap:anywhere}
.act-group{margin:10px 0;border:1px solid var(--border);border-radius:8px}
.act-group summary{min-height:44px;display:flex;align-items:center;padding:6px 10px;cursor:pointer;font-weight:600}
.act-row{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-top:1px dashed var(--border)}
.act-title{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.act-time{font-size:11px;color:var(--muted);white-space:nowrap}
.act-empty{margin:16px 0;color:var(--muted)}
.sb-menu{padding:10px 12px 0}
.sb-menu button{width:100%;min-height:44px}

/* PlanUI graph styles — UI-PLAN §4, §10, §11 (T3b-1).
 * Tokens from page_base.css only, no new colours, no url(), no @import.
 * Every interactive element has >= 44x44 px hit target at both viewports.
 */

.graph-wrap {
  position: relative;
  width: 100%;
  overflow: hidden;
}

#cy {
  position: relative;
  width: 100%;
  height: auto;             /* the app shell flexes #cy into the free estate */
  min-height: 240px;
  touch-action: none;
}

@media (max-width: 700px) {
  #cy {
    height: auto;
    min-height: 240px;
  }
}

/* Engine missing banner: UI-PLAN §14, §14b */
.engine-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  margin: 8px 12px;
  background: color-mix(in srgb, var(--state-blocked) 15%, var(--panel));
  border: 1px solid var(--state-blocked);
  border-radius: 8px;
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  z-index: 10;
}

.engine-banner button,
.banner-btn {
  appearance: none;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  min-height: 44px;
  min-width: 44px;
  padding: 6px 14px;
  border: 0;
  border-radius: 6px;
  background: var(--accent);
  color: var(--bg);
}

/* Phone focusProject chip row: UI-PLAN §10 (P1–P4, R12) */
.focus-chip-row {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 700px) {
  .focus-chip-row {
    display: flex;
  }
}

.focus-chip-row .chip-btn {
  appearance: none;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  min-height: 44px;
  min-width: 44px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.focus-chip-row .chip-btn[aria-pressed="true"],
.focus-chip-row .chip-btn.active {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}

/* Hit targets >= 44x44 px */
.chip-btn:focus-visible,
.engine-banner button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Hit target >= 44x44 px for .toggle while drawing checkbox at ~18 px */
.toggle {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  cursor: pointer;
}

.toggle input[type="checkbox"] {
  width: 18px;
  height: 18px;
  min-width: 18px;
  min-height: 18px;
  margin: 0;
}

/* D-677 operator-wait tokens. */
:root{--wait-answer:#b45309;--wait-task:#7c3aed}
@media (prefers-color-scheme:dark){:root{--wait-answer:#e69f00;--wait-task:#a78bfa}}


</style>
</head>
