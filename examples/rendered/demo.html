<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Read-only plan graph: dependencies, ready and blocked work, critical path.">
<title>plangraph example</title>
<style>
/* plangraph page — self-contained. No external fonts or images.
   Colour tokens come from the Okabe–Ito colour-blind-safe palette (see page.js
   for the equivalent JS fallbacks). Text colours are chosen per fill so every
   state label keeps a contrast ratio of at least 4.5:1. */

:root {
  --bg: #f6f6f4;
  --fg: #15171c;
  --muted: #5b616e;
  --panel: #ffffff;
  --border: #d5d8de;
  --accent: #33415c;

  /* display states (Okabe–Ito) + contrast-safe label colour */
  --state-ready: #009e73;        --state-ready-fg: #05170f;
  --state-blocked: #d55e00;      --state-blocked-fg: #1a0d00;
  --state-claimed: #56b4e9;      --state-claimed-fg: #062033;
  --state-in_review: #0072b2;    --state-in_review-fg: #ffffff;
  --state-open: #e69f00;         --state-open-fg: #1a1200;
  --state-done: #9e9e9e;         --state-done-fg: #15171c;
  --state-cancelled: #cfcfcf;    --state-cancelled-fg: #45484f;
  --state-start: #33415c;        --state-start-fg: #ffffff;

  --critical: #cc79a7;
  --group: #5b616e;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --fg: #e8eaee;
    --muted: #9aa3b2;
    --panel: #171b21;
    --border: #2b313a;
    --accent: #9fb4d8;

    --state-ready: #0e7c5a;      --state-ready-fg: #ffffff;
    --state-blocked: #b84a00;    --state-blocked-fg: #ffffff;
    --state-claimed: #2e7fb0;    --state-claimed-fg: #ffffff;
    --state-in_review: #00527f;  --state-in_review-fg: #ffffff;
    --state-open: #b8860b;       --state-open-fg: #0b0b0b;
    --state-done: #555b64;       --state-done-fg: #e8eaee;
    --state-cancelled: #3a3f47;  --state-cancelled-fg: #b9bfc9;
    --state-start: #9fb4d8;      --state-start-fg: #0b0f14;

    --critical: #cc79a7;
    --group: #9aa3b2;
  }
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

[hidden] { display: none !important; }

/* ---- header -------------------------------------------------------------- */
.top {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.top-title h1 { font-size: 17px; margin: 0; }
.top-title .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.progress { min-width: 220px; flex: 0 1 320px; }
.progress .bar {
  height: 10px; border-radius: 999px; overflow: hidden;
  background: color-mix(in srgb, var(--border) 70%, transparent);
}
.progress .bar span { display: block; height: 100%; width: 0; background: var(--state-ready); }
.progress .pct { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

/* ---- tabs ---------------------------------------------------------------- */
.tabs { display: flex; gap: 6px; padding: 8px 16px 0; }
.tabs button {
  appearance: none; cursor: pointer;
  background: transparent; color: var(--muted);
  border: 1px solid transparent; border-bottom: none;
  border-radius: 8px 8px 0 0;
  padding: 7px 14px; font: inherit;
}
.tabs button.active { background: var(--panel); color: var(--fg); border-color: var(--border); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- controls ------------------------------------------------------------ */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 20px;
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.control-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.control-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; cursor: pointer; font: inherit;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  border-radius: 999px; padding: 3px 11px;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

/* ---- panels -------------------------------------------------------------- */
.tabpanel { background: var(--panel); border-top: 1px solid var(--border); }
.graph-wrap { position: relative; }
#cy { width: 100%; height: min(72vh, 760px); touch-action: none; }
.empty { margin: 0; padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---- legend -------------------------------------------------------------- */
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 8px 16px; border-top: 1px solid var(--border); font-size: 12px;
}
.legend-title { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; }

/* ---- details panel ------------------------------------------------------- */
.details {
  position: fixed; top: 0; right: 0; z-index: 30;
  width: min(420px, 92vw); height: 100vh; overflow: auto;
  background: var(--panel); border-left: 1px solid var(--border);
  box-shadow: -8px 0 24px rgba(0, 0, 0, .18);
  padding: 14px 16px 48px;
}
.details-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.details-head h2 { font-size: 15px; margin: 0; word-break: break-all; }
.details-close {
  appearance: none; cursor: pointer; font: inherit; font-size: 18px; line-height: 1;
  border: 1px solid var(--border); background: transparent; color: var(--fg);
  border-radius: 6px; padding: 2px 8px;
}
.details-title { margin: 6px 0 10px; font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--border); color: var(--fg); }
.badge-kind, .badge-op, .badge-critical { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.badge-ready { background: var(--state-ready); color: var(--state-ready-fg); border-color: transparent; }
.badge-blocked { background: var(--state-blocked); color: var(--state-blocked-fg); border-color: transparent; }
.badge-claimed { background: var(--state-claimed); color: var(--state-claimed-fg); border-color: transparent; }
.badge-in_review { background: var(--state-in_review); color: var(--state-in_review-fg); border-color: transparent; }
.badge-open { background: var(--state-open); color: var(--state-open-fg); border-color: transparent; }
.badge-done { background: var(--state-done); color: var(--state-done-fg); border-color: transparent; }
.badge-cancelled { background: var(--state-cancelled); color: var(--state-cancelled-fg); border-color: transparent; }
.fields { display: grid; grid-template-columns: minmax(90px, 34%) 1fr; gap: 3px 10px; margin: 0; }
.fields dt { color: var(--muted); font-size: 12px; }
.fields dd { margin: 0; word-break: break-word; }
.keys { display: flex; flex-wrap: wrap; gap: 5px; }
.keylink {
  appearance: none; cursor: pointer; font: inherit; font-size: 12px;
  border: 1px solid var(--border); background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--fg); border-radius: 6px; padding: 1px 7px;
}
.keylink.unknown { opacity: .6; cursor: not-allowed; text-decoration: line-through; }
.details h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 4px; }
.details .criteria { margin: 0; }
.evidence { list-style: none; margin: 0; padding: 0; }
.evidence li { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.ev-ref { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.ev-ok { color: var(--state-ready); font-size: 12px; }
.ev-kind { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }

/* ---- list view ----------------------------------------------------------- */
#list-content { padding: 12px 16px 48px; max-width: 900px; margin: 0 auto; }
.list-h { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; border-left-width: 6px; }
.row-ready { border-left-color: var(--state-ready); }
.row-blocked { border-left-color: var(--state-blocked); }
.row-claimed { border-left-color: var(--state-claimed); }
.row-in_review { border-left-color: var(--state-in_review); }
.row-open { border-left-color: var(--state-open); }
.row-done { border-left-color: var(--state-done); }
.row-cancelled { border-left-color: var(--state-cancelled); }
.row-main {
  display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left;
  appearance: none; cursor: pointer; font: inherit; color: var(--fg);
  background: transparent; border: 0; padding: 9px 12px;
}
.row-main:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.row-key { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
.row-title { font-weight: 600; }
.row-meta { font-size: 12px; color: var(--muted); }
.row-blockers { padding: 0 12px 9px; font-size: 12px; color: var(--state-blocked); }

@media (max-width: 700px) {
  .top { padding: 10px 12px; }
  .progress { min-width: 100%; flex-basis: 100%; }
  #tab-list { order: -1; }
  #cy { height: 68vh; }
  .details {
    top: auto; bottom: 0; right: 0; left: 0; width: 100%; height: min(78vh, 620px);
    border-left: none; border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0, 0, 0, .2);
  }
}

</style>
</head>
<body>
<header class="top">
  <div class="top-title">
    <h1>plangraph example</h1>
    <p class="sub" id="meta-line"></p>
  </div>
  <div class="progress" id="progress">
    <div class="bar" role="img" aria-label="percent done"><span id="progress-bar"></span></div>
    <p class="pct" id="progress-text"></p>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Views">
  <button id="tab-graph" type="button" role="tab" aria-selected="true" aria-controls="panel-graph">Graph</button>
  <button id="tab-list" type="button" role="tab" aria-selected="false" aria-controls="panel-list">List</button>
</nav>

<section class="controls" aria-label="Filters">
  <div class="control-group">
    <span class="control-label">Projects</span>
    <div id="project-chips" class="chips"></div>
  </div>
  <div class="control-group">
    <span class="control-label">Tracks</span>
    <div id="track-chips" class="chips"></div>
  </div>
  <div class="control-group">
    <label class="toggle"><input type="checkbox" id="collapse-done" checked> Collapse done per track</label>
  </div>
</section>

<main>
  <section id="panel-graph" class="tabpanel" role="tabpanel" aria-labelledby="tab-graph" hidden>
    <div class="graph-wrap">
      <div id="cy" aria-label="Dependency graph"></div>
      <p id="graph-empty" class="empty" hidden></p>
    </div>
    <div class="legend" id="legend" aria-label="Colour legend"></div>
  </section>

  <section id="panel-list" class="tabpanel" role="tabpanel" aria-labelledby="tab-list" hidden>
    <div id="list-content"></div>
  </section>
</main>

<script>/* plangraph page logic — pure, DOM-free, no I/O.
 *
 * Everything the page needs to derive from the snapshot lives here and is exposed
 * on `PlanGraph` (browser) and `module.exports` (node). `page_ui.js` draws it.
 * The rules mirror docs/SPEC.md:
 *   - ready   = state `open` and every dependency `done`
 *   - blocked = state `open` or `claimed` with at least one unmet dependency
 *   - critical path = longest remaining path by estimate_h over non-terminal items
 * A dependency is met only when the target item exists and is `done`; `cancelled`
 * never satisfies a dependency.
 */
(function (global) {
  "use strict";

  var TERMINAL = { done: true, cancelled: true };

  function normItems(items) {
    return Array.isArray(items) ? items.filter(Boolean) : [];
  }

  function indexByKey(items) {
    var m = {};
    normItems(items).forEach(function (it) {
      if (it.key) m[it.key] = it;
    });
    return m;
  }

  function depMet(depKey, idx) {
    var d = idx[depKey];
    return !!(d && d.state === "done");
  }

  function unmetDeps(item, idx) {
    return normItems(item && item.depends_on).filter(function (k) {
      return !depMet(k, idx);
    });
  }

  function displayState(item, idx) {
    var s = item.state;
    if (s === "done" || s === "cancelled" || s === "in_review") return s;
    if (unmetDeps(item, idx).length) return "blocked";
    if (s === "claimed") return "claimed";
    return "ready";
  }

  function computeDisplayState(items) {
    var idx = indexByKey(items);
    var out = {};
    normItems(items).forEach(function (it) {
      out[it.key] = displayState(it, idx);
    });
    return out;
  }

  function unblocksMap(items) {
    var m = {};
    normItems(items).forEach(function (it) {
      m[it.key] = 0;
    });
    normItems(items).forEach(function (it) {
      if (isTerminal(it)) return; // SPEC: count non-terminal waiters only
      normItems(it.depends_on).forEach(function (d) {
        if (m[d] !== undefined) m[d] += 1;
      });
    });
    return m;
  }

  function isTerminal(item) {
    return !!(item && TERMINAL[item.state]);
  }

  function estimate(item) {
    var v = Number(item && item.estimate_h);
    return isFinite(v) ? v : 0;
  }

  function byKeyAsc(a, b) {
    return a < b ? -1 : a > b ? 1 : 0;
  }

  /* Longest remaining path by estimate_h over non-terminal items, ending at a
   * goal when one is reachable, otherwise ending at the single longest chain.
   * Kahn's algorithm keeps it iterative and cycle-safe: nodes in a cycle are
   * simply left out rather than causing an infinite loop. */
  function criticalPath(items) {
    items = normItems(items);
    var nodes = items.filter(function (it) {
      return !isTerminal(it);
    });
    var nset = {};
    nodes.forEach(function (n) {
      nset[n.key] = n;
    });

    var indeg = {};
    var best = {};
    var prev = {};
    nodes.forEach(function (n) {
      indeg[n.key] = 0;
    });
    nodes.forEach(function (n) {
      normItems(n.depends_on).forEach(function (d) {
        if (nset[d]) indeg[n.key] += 1;
      });
    });

    var queue = [];
    nodes.forEach(function (n) {
      if (indeg[n.key] === 0) queue.push(n.key);
    });
    queue.sort(byKeyAsc);

    var order = [];
    while (queue.length) {
      var k = queue.shift();
      order.push(k);
      nodes.forEach(function (n) {
        if (nset[n.key] && normItems(n.depends_on).indexOf(k) >= 0) {
          indeg[n.key] -= 1;
          if (indeg[n.key] === 0) queue.push(n.key);
        }
      });
      queue.sort(byKeyAsc);
    }

    order.forEach(function (k) {
      var n = nset[k];
      var est = estimate(n);
      var total = est;
      var from = null;
      normItems(n.depends_on).forEach(function (d) {
        if (best[d] !== undefined) {
          var cand = best[d] + est;
          if (cand > total) {
            total = cand;
            from = d;
          }
        }
      });
      best[k] = total;
      prev[k] = from;
    });

    var target = null;
    var goalH = -Infinity;
    var anyH = -Infinity;
    var anyK = null;
    order.forEach(function (k) {
      if (best[k] > anyH) {
        anyH = best[k];
        anyK = k;
      }
      if (nset[k].kind === "goal" && best[k] > goalH) {
        goalH = best[k];
        target = k;
      }
    });
    if (target === null) target = anyK;

    var hours = target ? best[target] : 0;
    var keys = [];
    var guard = 0;
    while (target && guard <= order.length) {
      keys.unshift(target);
      target = prev[target];
      guard += 1;
    }
    return { keys: keys, hours: hours };
  }

  /* Percent done by estimate (default) or by item count. Cancelled items are

        PP.renderLegend();
        PP.renderGraph();
      };
      if (mq.addEventListener) mq.addEventListener("change", onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }

  function init() {
    var data = PP.$("snapshot-data");
    if (!data) return;
    try {
      state.snapshot = JSON.parse(data.textContent);
    } catch (e) {
      state.snapshot = { items: [] };
    }
    if (!state.snapshot || typeof state.snapshot !== "object") state.snapshot = { items: [] };
    state.items = (state.snapshot.items || []).slice();
    state.projects = PP.uniqueSorted(state.items.map(function (i) {
      return i.project;
    }));
    state.tracks = PP.uniqueSorted(state.items.map(function (i) {
      return i.track;
    }));
    PP.recompute();
    PP.renderHeader();
    PP.renderChips();
    PP.renderLegend();
    bind();
    renderDetails(null);
    PP.renderGraph();
    renderList();
    var mobile = global.matchMedia && global.matchMedia("(max-width: 700px)").matches;
    setTab(mobile ? "list" : "graph");
  }

  PP.selectNode = selectNode;
  PP.focusNode = focusNode;
  PP.renderList = renderList;
  PP.renderDetails = renderDetails;
  PP.setTab = setTab;
  PP.rerender = rerender;
  PP.init = init;

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})(typeof window !== "undefined" ? window : globalThis);
</script>
</body>
</html>
