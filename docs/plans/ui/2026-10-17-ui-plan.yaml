    title: 'Live page follows origin/main: render unit in the repo, deploy after green CI, post-deploy stamp check'
    description: 'Today a merge reaches the live page only through the manual live-sync runbook (new detached worktree plus a hand-edited drop-in), and the render unit is not in the repo (plan section 1).
      No crons (D-1377): the merge triggers the deploy (CI job or path unit), not a schedule. Design: plangraph docs/plans/ui/2026-10-17-ui-plan.md; spec docs/ui/VIEWS.md. Writer and seats: model order
      D-1714. Standing step D-323: Playwright checklist at 1440x900 and 390x844 with screenshots.'
    done_criteria: render service, drop-in template and nginx snippet committed under deploy/; a merge to main with green CI updates a fixed live worktree and re-renders, keeping the old page if the render
      fails; nginx sends Cache-Control no-cache for the page; a post-deploy check compares the page stamp with origin/main and reports a mismatch older than 30 min; one live run recorded (router GO for
      the live step)
    depends_on:
