#   891 GB disk, Docker Desktop 29.7.2 (no docker inside the WSL distro).
# Operator: runner on Docker Desktop, no CPU cap, 32 GB RAM cap; stop using GitHub-hosted runners for now; workstation for
#   speed until repos go public / faster CI exists. Note: AutoOS, Tools, chaptarr, OmniRoute, great-wiki are PUBLIC -> fork-PR guard.
