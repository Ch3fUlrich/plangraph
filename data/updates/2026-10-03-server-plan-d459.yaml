    item: {project: server, id: LL-DISCLOSE, kind: lane, track: OWUI, owner: server-L1-main, review_tier: standard, estimate_h: 1,
           title: "Disclose free LLM fallbacks: Open WebUI banner, LiteLLM free-leg labels, app docs (D-459)",
