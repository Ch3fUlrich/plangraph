# plangraph-keeper-proxy: one LAN listener, forwards /v1/ to the loopback keeper.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    server {
        listen 192.168.178.73:8788;

        client_max_body_size 1m;          # apply_ops batches are the largest bodies

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8787;
            # The keeper trusts no forwarding headers; do not invent any.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_read_timeout 60s;       # fetch-on-demand may take up to 20 s
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
