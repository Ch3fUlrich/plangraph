# plangraph-keeper-proxy: one LAN listener, forwards /v1/ to the loopback keeper.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    # Slow-client limits (seat 2, finding 8): one worker must not be pinned by idle sockets.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    server {
        listen 192.168.178.73:8788;

        # Only the Caddy edge (OPNsense, 192.168.178.76) and local checks may connect; any other LAN host
        # gets 403 and never sees the keeper (seat 2, findings 7/8). Verify the edge IP at go-live.
        allow 192.168.178.76;
        allow 192.168.178.73;             # this host (healthcheck); it reaches the keeper on loopback anyway
        allow 127.0.0.1;
        deny all;

        client_max_body_size 1m;          # apply_ops batches are the largest bodies

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # The keeper's unauthenticated liveness probe stays local (seat 2, finding 1).
        # Regex, not "=": nginx matches on the normalised URI (merge_slashes, dot segments), so
        # /v1//health, /v1/./health, /v1/health/ and /v1/health/x all land here (the keeper routes on
        # the first non-empty segment only and does not percent-decode it).
        location ~ ^/v1/health(/|$) {
            return 404;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8787;
            # The keeper trusts no forwarding headers; do not invent any.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_read_timeout 60s;       # fetch-on-demand may take up to 20 s
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
