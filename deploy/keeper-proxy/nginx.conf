# plangraph-keeper-proxy: one mutual-TLS LAN listener, forwards /v1/ to the loopback keeper.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    # Slow-client limits (seat 2, finding 8): one worker must not be pinned by idle sockets.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    # Local plain listener for the container healthcheck only (never reaches the keeper).
    server {
        listen 127.0.0.1:8789;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / { return 404; }
    }

    server {
        # D-759 option A: TLS on the Caddy -> sidecar hop, mutual. The sidecar proves itself with a cert from the
        # keeper-proxy CA (SAN keeper.example.internal + LAN IP); Caddy must present the CA-signed client cert, so a LAN host
        # without it gets no TLS session at all, and a sniffer sees no bearer.
        listen 192.0.2.10:8788 ssl;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_client_certificate /etc/nginx/tls/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # Only the Caddy edge (OPNsense, 192.0.2.11) and local checks may connect; any other LAN host
        # gets 403 and never sees the keeper (seat 2, findings 7/8). Verify the edge IP at go-live.
        allow 192.0.2.11;
        allow 127.0.0.1;
        deny all;

        client_max_body_size 1m;          # apply_ops batches are the largest bodies

        # Raw dot segments (also percent-encoded) never reach the keeper: nginx matches locations on the
        # normalised URI, so /v1/health/.. would otherwise match "/v1/" while the keeper saw "health".
        if ($request_uri ~* "(/|%2f)(\.|%2e){1,2}(/|%2f|\?|$)") {
            return 400;
        }

        # The keeper's unauthenticated liveness probe stays local (seat 2, finding 1).
        # Regex, not "=": nginx matches on the normalised URI (merge_slashes, dot segments), so
        # /v1//health, /v1/./health, /v1/health/ and /v1/health/x all land here (the keeper routes on
        # the first non-empty segment only and does not percent-decode it).
        location ~ ^/v1/health(/|$) {
            return 404;
        }

        location /v1/ {
            # With a URI part nginx forwards the normalised path it matched, not the raw request line.
            proxy_pass http://127.0.0.1:8787/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8787;
            # The keeper trusts no forwarding headers; do not invent any.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_read_timeout 60s;       # fetch-on-demand may take up to 20 s
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
