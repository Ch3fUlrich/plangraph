# =====================================================================#
#  plangraph-keeper-proxy — LAN sidecar for the keeper API (PG-PROXY-ACCESS, D-713)
#  Caddy vhost keeper.ohje.ooguy.com (TLS, IP allowlist as omnigraph, no Authelia)
#  -> coding.vm 192.168.178.73:8788 (this container) -> keeper 127.0.0.1:8787.
#  The keeper keeps its loopback-only bind; auth stays the per-principal bearer.
#  NOT LIVE until the parked router item PG-PROXY-LISTENER is approved.
# =====================================================================#
services:
  keeper-proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: plangraph-keeper-proxy
    restart: unless-stopped
    network_mode: host          # reach the keeper on the host loopback
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://192.168.178.73:8788/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging: { driver: local, options: { max-size: "5m", max-file: "2" } }
