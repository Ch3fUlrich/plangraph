ram_per_run_bytes = 4000000000
ram_floor_bytes = 3000000000
windows_ram_floor_bytes = 6000000000
disk_floor_bytes = 10000000000
quota_floor_percent = 10.0
cpu_pressure_max_percent = 50.0
facts_max_age_seconds = 300
quota_max_age_seconds = 10800
quota_facts_max_age_seconds = 900
estimate_tokens = 100000
tick_budget_seconds = 100

# Match full configured host names first, then their first DNS label.
[max_writers]
coding = 3
dell = 5
workstation = 8
