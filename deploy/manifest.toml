# The deploy manifest: every systemd unit file under deploy/ (any depth) and every binary target of the
# workspace crates is named here, with the host roles it belongs on and what proves it works.
#
# Roles, not host names: `keeper` (the keeper host), `worker` (a spawn worker host), `wsl` (a WSL
# worker host) and `all`. A host lists its roles in PG_HOST_ROLES or in ~/.config/plangraph/host-roles.
# env_family names the `host-sync --install-env` family that creates the env files from documented defaults;
# without it a missing env file is reported by name for the operator (secrets are never created).
# dir names the directory under deploy/ that holds the unit files when it is not deploy/systemd ("." is deploy/ itself).
# installer names the script and step that render a template unit (*.in, or @ROOT@ placeholders) into the installed
# units, the unit names it writes (renders) and the one it enables (enable); the files above are sources, not installed names.
# install_paths on a binary lists every path a consumer runs it from, each with the roles it applies to;
# no list means only ~/.local/bin/<bin>, and a binary used from two places lists both.
# env_files are file names under ~/.config/plangraph (or /etc/plangraph for system units), never values;
# %i stands for the instance of a template unit.
# first_run is what an operator checks after the first start.
# To leave a unit or binary out, give it an entry with not_deployed = "<reason>"; the coverage test
# (rust/plangraph-cli/tests/deploy_manifest.rs) fails for anything this file does not name.
# See deploy/systemd/README.md.

# --- unit families -------------------------------------------------------------------------------

[[unit]]
name = "liveness-watchdog"
dir = "liveness"
files = ["liveness-watchdog@.service", "liveness-watchdog@.timer"]
hosts = ["all"]
first_run = "enable one instance per config under ~/.config/plangraph/liveness; its timer then drives one pass every 10 minutes"

[[unit]]
name = "pganchor"
dir = "pganchor"
files = ["pganchor.socket", "pganchor@.service"]
enable = "pganchor.socket"
scope = "system"
hosts = ["keeper"]
first_run = "the keeper appends an anchor record through /run/pganchor/anchor.sock (operator step: root installs both units)"

[[unit]]
name = "flow-watchdog"
dir = "watchdog"
files = ["flow-watchdog.service", "flow-watchdog.timer"]
env_files = ["flow-watchdog.env"]
not_deployed = "service and timer await a host collector that refreshes ~/.local/state/plangraph/flow-snapshot.json (docs/flow-watchdog.md)"

[[unit]]
name = "stall-watchdog"
dir = "watchdog"
files = ["watchdog.service", "watchdog.timer"]
hosts = ["all"]
env_files = ["watchdog.env"]
first_run = "systemctl --user is-active plangraph-stall-watchdog.timer; the unit files carry @ROOT@ and @PYTHON@ placeholders, so the installer renders them and a verbatim copy would be wrong"

[unit.installer]
via = "deploy/bootstrap.sh"
step = "python -m plangraph.spawner.stall_watchdog install --host linux"
renders = ["plangraph-stall-watchdog.service", "plangraph-stall-watchdog.timer", "plangraph-remote-probe.service", "plangraph-remote-probe.timer"]
enable = "plangraph-stall-watchdog.timer"

[[unit]]
name = "ctx-watchdog"
dir = "ctx-watchdog"
files = ["ctx-watchdog.service.in", "ctx-watchdog.timer.in"]
enable = "ctx-watchdog.timer.in"
hosts = ["all"]
first_run = "systemctl --user is-enabled ctx-watchdog.timer after bootstrap with ctx-watchdog.json filled in (deploy/ctx-watchdog/config.example.json); the unit files carry @ROUTER_DIR@, so the installer renders them"

[unit.installer]
via = "deploy/bootstrap.sh"
step = "install_ctx_watchdog renders ctx-watchdog.service and ctx-watchdog.timer into the user unit directory"
renders = ["ctx-watchdog.service", "ctx-watchdog.timer"]
enable = "ctx-watchdog.timer"

[[unit]]
name = "pg-feeder"
files = ["pg-feeder.service", "pg-feeder.timer"]
hosts = ["keeper"]
env_files = ["plangraph.env"]
first_run = "systemctl --user start pg-feeder.service exits 0; journalctl --user -u pg-feeder shows a feed pass"

[[unit]]
