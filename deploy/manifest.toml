# The deploy manifest: every systemd unit file under deploy/systemd and every binary target of the
# workspace crates is named here, with the host roles it belongs on and what proves it works.
#
# Roles, not host names: `keeper` (the keeper host), `worker` (a spawn worker host), `wsl` (a WSL
# worker host) and `all`. A host lists its roles in PG_HOST_ROLES or in ~/.config/plangraph/host-roles.
# env_family names the `host-sync --install-env` family that creates the env files from documented defaults;
# without it a missing env file is reported by name for the operator (secrets are never created).
# dir names the directory under deploy/ that holds the unit files when it is not deploy/systemd.
# env_files are file names under ~/.config/plangraph (or /etc/plangraph for system units), never values.
# first_run is what an operator checks after the first start; `plangraph deploy-status` also reads the
# unit's active state, enabled state and last run result.
# To leave a unit or binary out, give it an entry with not_deployed = "<reason>"; the coverage test
# (rust/plangraph-cli/tests/deploy_manifest.rs) fails for anything this file does not name.
# See deploy/systemd/README.md for the install and status commands.

# --- unit families -------------------------------------------------------------------------------

[[unit]]
name = "pg-deploy-status"
files = ["pg-deploy-status.service", "pg-deploy-status.timer"]
hosts = ["all"]
first_run = "systemctl --user start pg-deploy-status.service lists every entry and writes ~/.local/state/plangraph/deploy-live/<host>.json"

[[unit]]
name = "plangraph-host-sync"
files = ["plangraph-host-sync.service", "plangraph-host-sync.timer"]
hosts = ["all"]
first_run = "systemctl --user start plangraph-host-sync.service journals 'nothing to do' on a complete host"

[[unit]]
name = "liveness-watchdog"
dir = "liveness"
files = ["liveness-watchdog@.service", "liveness-watchdog@.timer"]
hosts = ["all"]
first_run = "enable one instance per config under ~/.config/plangraph/liveness; its timer then drives one pass every 10 minutes"

[[unit]]
name = "pganchor"
dir = "pganchor"
files = ["pganchor.socket", "pganchor@.service"]
enable = "pganchor.socket"
scope = "system"
hosts = ["keeper"]
first_run = "the keeper appends an anchor record through /run/pganchor/anchor.sock (operator step: root installs both units)"

[[unit]]
name = "flow-watchdog"
dir = "watchdog"
files = ["flow-watchdog.service", "flow-watchdog.timer"]
not_deployed = "needs a host collector that refreshes ~/.local/state/plangraph/flow-snapshot.json (docs/flow-watchdog.md); none is deployed yet, the binary is installed on every host"

[[unit]]
name = "stall-watchdog"
dir = "watchdog"
files = ["watchdog.service", "watchdog.timer"]
not_deployed = "carries @ROOT@ and @PYTHON@ placeholders: `python -m plangraph.spawner.stall_watchdog install` renders and installs it (deploy/bootstrap.sh), so a verbatim copy would be wrong"

