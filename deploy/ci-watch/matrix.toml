"Python tests, SQLite keeper (shard 1 of 3)" = "sqlite"
"Python tests, SQLite keeper (shard 2 of 3)" = "sqlite"
"Python tests, SQLite keeper (shard 3 of 3)" = "sqlite"
"Python tests, Postgres keeper: contract and storage (shard 1 of 3)" = "postgres"
"Python tests, Postgres keeper: contract and storage (shard 2 of 3)" = "postgres"
"Python tests, Postgres keeper: contract and storage (shard 3 of 3)" = "postgres"
"UI tests in headless Chromium" = "browser"
"Rust workspace on Linux: fmt, clippy, tests" = "rust"
"Rust workspace tests (shard 1 of 3)" = "rust"
"Rust workspace tests (shard 2 of 3)" = "rust"
"Rust workspace tests (shard 3 of 3)" = "rust"
"Rust spawner and worker core tests on Windows" = "rust-windows"
"Rust worker crate: fmt, clippy, tests" = "rust-worker"
"Rust replay spike tests" = "rust-spike"
"ci-gate" = "ci-gate"

