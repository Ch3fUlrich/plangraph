# Leak-scanner config for the public build (make_public passes it with -c).
# Default rules stay on; the allowlists below are a REVIEWED set of synthetic, credential-shaped
# strings in test fixtures that exercise the credential guard / redactor.  Each entry needs the
# exact test path AND the exact fake value (condition = AND), so nothing else in those files, and
# nothing outside tests/, is ever exempt.  Never add a non-test path here.
title = "plangraph public build"

[extend]
useDefault = true

[[allowlists]]
description = "synthetic demo credential in md_sync fixtures and tests (reviewed 2026-10-10)"
condition = "AND"
targetRules = ["generic-api-key"]  # required (observed with the pinned scanner 8.30.1): without it only the paths are applied, not the values
paths = [
  '''^tests/fixtures/md_sync/sample_questions\.md$''',
  '''^tests/test_md_sync_parse\.py$''',
  '''^tests/test_md_sync_plan\.py$''',
]
regexes = ['''^(?:Zx81kQ92LmPq77Vb|AbCd1234Efgh)$''']

[[allowlists]]
description = "synthetic secret in the credential-guard test (reviewed 2026-10-10)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_keeper_credential_guard\.py$''']
regexes = ['''^svcacct/Zq9xk2LmPw$''']

[[allowlists]]
# PG-PUBLIC-FIX: the estimate/src-edit guard test asserts this exact pair is refused and never
# echoed, so it sits in the source as one plain literal (no splitting around the scanner).
# Same reviewed fake value as the credential-guard entry, scoped to this file AND this value.
description = "synthetic credential the estimate-src-edit guard refuses (reviewed 2026-10-23)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_keeper_estimate_src_edit\.py$''']
regexes = ['''^svcacct/Zq9xk2LmPw$''']

[[allowlists]]
# PG-PUBLIC-FIX: the key-guard refusal corpus (REAL) expects this pair refused and masked, so it
# is one plain literal too.  Scoped to this file AND this value: another credential-shaped
# string written here is still reported.
description = "synthetic password the key-guard refusal corpus expects refused (reviewed 2026-10-23)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_keeper_guard_key\.py$''']
regexes = ['''^svc/Xk9fT2mQ$''']
