# Leak-scanner config for the public build (make_public passes it with -c).
# Default rules stay on; the allowlists below are a REVIEWED set of synthetic, credential-shaped
# strings in test fixtures that exercise the credential guard / redactor.  Each entry needs the
# exact test path AND the exact fake value (condition = AND), so nothing else in those files, and
# nothing outside tests/, is ever exempt.  Never add a non-test path here.
title = "plangraph public build"

[extend]
useDefault = true

[[allowlists]]
description = "synthetic demo credential in md_sync fixtures and tests (reviewed 2026-10-10)"
condition = "AND"
targetRules = ["generic-api-key"]  # required: without it only the paths are applied, not the values
paths = [
  '''^tests/fixtures/md_sync/sample_questions\.md$''',
  '''^tests/test_md_sync_parse\.py$''',
  '''^tests/test_md_sync_plan\.py$''',
]
regexes = ['''^(?:Zx81kQ92LmPq77Vb|AbCd1234Efgh)$''']

[[allowlists]]
description = "synthetic secret in the credential-guard test (reviewed 2026-10-10)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_keeper_credential_guard\.py$''']
regexes = ['''^svcacct/Zq9xk2LmPw$''']
