# Public-split manifest (M2c).  Consumed by tools/split/make_public.py and, for the
# [scrub] section, by scrub_check.py (--rules tools/split/manifest.toml).
# Only what is listed under [public] is ever copied; the source .git is never read.

[public]
# Required: make_public refuses if one is missing.  Directories are copied recursively.
include = [
  "src", "tests", "tools", "vendor", "examples",
  "docs/BATCH.md", "docs/KEEPER.md", "docs/SPEC.md", "docs/PUBLIC.md",
]
# Copied when present, silently skipped otherwise.
optional = ["LICENSE", "README.md", "pyproject.toml", ".gitignore"]
# Removed from the selection (glob: ** spans dirs, * and ? do not; a slash-less
# pattern matches a name at any depth).  Add real-data fixtures and private tools here.
exclude = [
  "**/__pycache__/**", "*.pyc", ".pytest_cache/**",
  "tests/fixtures/real/**", "tests/fixtures/private/**",
  "tools/private_*", "tools/local_*",
]

[deny]
# If any of these survive the allow-list + exclude, make_public REFUSES (it does not
# silently drop them: a deny hit means the allow-list is wrong).
paths = [
  ".claude/**", "out/**", ".git/**", "**/.git/**",
  "*.db", "*.sqlite", "*.sqlite3", "*.db-wal", "*.db-shm",
  ".env", ".env.*", "*.pem", "*.key", "id_rsa*", ".netrc", "*.token",
  "**/secrets/**", "**/private/**",
  "DECISIONS.md", "QUESTIONS*", "ANSWERS*", "plan.snapshot.json",
  "*.bundle", "*.tgz", "*.log",
]

[commit]
author_name = "plangraph contributors"
author_email = "noreply@example.invalid"
message = "Initial public history of plangraph"

[scrub]
# Extra regexes / allowances for scrub_check (keep real hostnames in a PRIVATE rules
# file passed with --rules, not here):
hostname_patterns = []
allow_email_domains = []

# Vendored third-party code: minified JS trips entropy/IP/e-mail heuristics.
[[scrub.allow]]
path = "vendor/**"
rules = ["ipv4", "ipv6", "email", "high-entropy", "token-shape", "hostname", "credential-shape"]

# Tests that deliberately contain obviously fake credential strings (reviewed, synthetic).
[[scrub.allow]]
path = "src/plangraph/keeper/credential_guard.py"
rules = ["credential-shape"]
[[scrub.allow]]
path = "tests/test_keeper_credential_guard.py"
rules = ["credential-shape"]
[[scrub.allow]]
path = "tests/test_evidence_*.py"
rules = ["credential-shape"]
[[scrub.allow]]
path = "tests/test_apply_batch.py"
rules = ["token-shape"]
[[scrub.allow]]
path = "tests/test_mcp.py"
rules = ["token-shape"]
[[scrub.allow]]
path = "tests/test_keeper_final_a.py"
rules = ["token-shape", "high-entropy"]
# These two name the rule/guard in prose and file paths next to the word "credential".
[[scrub.allow]]
path = "docs/PUBLIC.md"
rules = ["credential-shape"]
[[scrub.allow]]
path = "tools/split/manifest.toml"
rules = ["credential-shape"]
