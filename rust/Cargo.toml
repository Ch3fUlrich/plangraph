[workspace]
resolver = "2"
members = ["og-memory", "pg-ctx", "pg-hook", "pg-jail", "pg-mcp", "pg-probe", "pg-reap", "pg-spawnd", "worker-core"]
exclude = ["spikes"]

# Tests and local builds: dependencies are built once and cached, so they get
# full optimization; workspace crates get light optimization. The scan and
# fixture loops in the unit tests are several times faster than at opt-level 0,
# while debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
