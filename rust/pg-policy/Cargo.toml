[package]
name = "pg-policy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
regex = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
pg-worker-core = { path = "../worker-core", features = ["test-support"] }
tempfile = "3"
