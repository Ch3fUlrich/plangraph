[package]
name = "pg-spawnd"
version = "0.1.0"
edition = "2021"
description = "Host capacity probe CLI"

[dependencies]
pg-worker-core = { path = "../worker-core" }
rmcp = { version = "2.2", default-features = false, features = ["server", "transport-async-rw"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
sha2 = "0.10"
regex = "1"
tempfile = "3"
tokio = { version = "1.53", features = ["rt", "net", "io-util", "macros", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pg-worker-core = { path = "../worker-core", features = ["test-support"] }
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    # prompt_git_race_tests closes the disposable producer's stdout handle.
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
] }
