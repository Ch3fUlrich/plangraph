[package]
name = "temporal-spike"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.92"

# Standalone: not a member of any other workspace.
[workspace]

[dependencies]
temporalio-sdk = { version = "=1.1.0", default-features = false }
temporalio-client = "=1.1.0"
temporalio-common = "=1.1.0"
temporalio-macros = "=1.1.0"
temporalio-workflow = "=1.1.0"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
