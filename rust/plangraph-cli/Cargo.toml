[package]
name = "plangraph-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"

[[bin]]
name = "plangraph"
path = "src/main.rs"
