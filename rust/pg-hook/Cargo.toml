[package]
name = "pg-hook"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pg-worker-core = { path = "../worker-core", features = ["test-support"] }
tempfile = "3"

[[bin]]
name = "commit-msg"
path = "src/commit_msg.rs"
