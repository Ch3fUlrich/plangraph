[package]
name = "pg-hook"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
globset = "0.4"
pg-worker-core = { path = "../worker-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
shlex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
pg-worker-core = { path = "../worker-core", features = ["test-support"] }

[[bin]]
name = "commit-msg"
path = "src/commit_msg.rs"

[[bin]]
name = "checkpoint-size"
path = "src/checkpoint_size.rs"


[[bin]]
name = "guard-hook"
path = "src/guard_hook.rs"
