[package]
name = "pg-worker-core"
version = "0.1.0"
edition = "2021"
description = "Engine-free core of a worker that runs coding-agent attempts for cards"

[lib]
name = "pg_worker_core"

[[bin]]
name = "live_probe_child"
path = "tests/support/live_probe_child.rs"
test = false
required-features = ["test-support"]

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
thiserror = "2"
libc = "0.2"
rand = "0.9"
regex = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
