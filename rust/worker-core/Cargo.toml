[package]
name = "pg-worker-core"
version = "0.1.0"
edition = "2021"
description = "Engine-free core of a worker that runs coding-agent attempts for cards"

[lib]
name = "pg_worker_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
thiserror = "2"
libc = "0.2"
rand = "0.9"
regex = "1"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
