[package]
name = "pg-keeper-backup"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.10"

[dev-dependencies]
pg-worker-core = { path = "../worker-core", features = ["test-support"] }
tempfile = "3"

[[bin]]
name = "pg-keeper-backup"
path = "src/main.rs"

[[bin]]
name = "fake-docker"
path = "tests/support/fake_docker.rs"
test = false
