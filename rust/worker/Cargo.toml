[package]
name = "pg-worker"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.92"
description = "Temporal worker: one workflow per card, attempts run over pg-worker-core"

# Standalone like the spike: heavy Temporal deps stay out of the worker-core workspace.
[workspace]

[lib]
name = "pg_worker"

[[bin]]
name = "pg-worker"
path = "src/bin/worker.rs"

[dependencies]
pg-worker-core = { path = "../worker-core" }
temporalio-sdk = { version = "=1.1.0", default-features = false }
temporalio-client = "=1.1.0"
temporalio-common = "=1.1.0"
temporalio-macros = "=1.1.0"
temporalio-workflow = "=1.1.0"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
# Without float_roundtrip serde_json can parse a float one ulp off (flaky Tick wire round-trip, activity result diverging from replay).
serde_json = { version = "1", features = ["float_roundtrip"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
