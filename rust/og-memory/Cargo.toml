[package]
name = "og-memory"
version = "0.1.0"
edition = "2021"

[features]
default = []
mock = []

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
pg-worker-core = { path = "../worker-core" }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
