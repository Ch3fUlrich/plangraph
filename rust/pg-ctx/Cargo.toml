[package]
name = "pg-ctx"
version = "0.1.0"
edition = "2021"

[dependencies]
gix = { version = "0.90", default-features = false, features = ["sha1", "revision", "blocking-http-transport-reqwest-rust-tls"] }
pg-worker-core = { path = "../worker-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
